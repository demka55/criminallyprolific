[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Allow sendfox recaptcha to work cross-origin
[[headers]]
  for = "/signup/"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"

[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/knowledge-share/"
  to = "/#interviews"
  status = 301

[[redirects]]
  from = "/knowledge-share"
  to = "/#interviews"
  status = 301

# Route /api/* to Netlify functions
[[redirects]]
  from = "/api/sma-auth"
  to = "/.netlify/functions/sma-auth"
  status = 200

[[redirects]]
  from = "/api/sma-seo-track"
  to = "/.netlify/functions/sma-seo-track"
  status = 200

[[redirects]]
  from = "/api/admin-auth"
  to = "/.netlify/functions/admin-auth"
  status = 200

[[redirects]]
  from = "/api/seo-track"
  to = "/.netlify/functions/seo-api"
  status = 200
