<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Overview Tracker — Criminally Prolific</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a84c;--gold-dim:#8a6e2f;--gold-muted:#f5ecd8;
  --ink:#1a1410;--ink-soft:#4a3f32;--ink-muted:#7a6e60;
  --cream:#f5f0e8;--cream-dark:#d9cdb8;--white:#fff;
  --red:#c0392b;--green:#1a5c2a;--green-bg:#edf7f0;
  --red-bg:#fdf0f0;--amber:#b7791f;--amber-bg:#fffbeb;
  --blue-bg:#eff6ff;--blue:#1a4a8a;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}

/* ── Login ── */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.lbox{background:var(--white);border:1px solid var(--cream-dark);border-radius:8px;padding:2.5rem;width:100%;max-width:380px;text-align:center}
.lbox h2{font-family:var(--serif);font-size:1.5rem;margin-bottom:.25rem}
.lbox p{font-size:13px;color:var(--ink-muted);margin-bottom:1.75rem}
.linput{width:100%;padding:10px 14px;border:1px solid var(--cream-dark);border-radius:4px;font-family:var(--sans);font-size:15px;background:var(--cream);color:var(--ink);margin-bottom:.75rem}
.lbtn{width:100%;padding:11px;background:var(--gold);color:var(--white);border:none;border-radius:4px;font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer}
.lerr{font-size:13px;color:var(--red);margin-top:.5rem;display:none}

/* ── App shell ── */
#app{display:none;max-width:1200px;margin:0 auto;padding:2rem 1.5rem 4rem}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.75rem;flex-wrap:wrap;gap:1rem}
.topbar h1{font-family:var(--serif);font-size:2.25rem;font-weight:700}
.topbar p{font-size:14px;color:var(--ink-muted);margin-top:3px}
.actions{display:flex;gap:.5rem;align-items:center}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 18px;border-radius:4px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--cream-dark);background:var(--white);color:var(--ink)}
.btn:hover{background:var(--cream)}
.btn.gold{background:var(--gold);color:var(--white);border-color:transparent}
.btn.gold:hover{background:var(--gold-dim)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── Status bar ── */
.sbar{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--cream-dark);border-radius:4px;padding:9px 16px;font-size:13px;color:var(--ink-muted);margin-bottom:1.25rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cream-dark);flex-shrink:0}
.dot.green{background:#27ae60}
.dot.amber{background:var(--amber);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── KPI cards ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:1.5rem}
.kpi{background:var(--white);border:1px solid var(--cream-dark);border-radius:6px;padding:14px 18px}
.kpi-l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-bottom:5px}
.kpi-v{font-size:28px;font-weight:700;font-family:var(--serif);color:var(--ink)}
.kpi-s{font-size:12px;color:var(--ink-muted);margin-top:3px}
.kpi-v.green{color:var(--green)}
.kpi-v.amber{color:var(--amber)}
.kpi-v.red{color:var(--red)}

/* ── History chart ── */
.hist{background:var(--white);border:1px solid var(--cream-dark);border-radius:6px;padding:1.25rem;margin-bottom:1.5rem}
.hist h3{font-size:12px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.875rem;display:flex;align-items:center;gap:1rem}
.hist-legend{display:flex;gap:.75rem;font-weight:400;text-transform:none;letter-spacing:0}
.hist-legend span{display:flex;align-items:center;gap:4px;font-size:12px}
.hdot{width:10px;height:10px;border-radius:2px}
.hchart{display:flex;align-items:flex-end;gap:3px;height:64px;overflow-x:auto}
.hcol{display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0;position:relative;cursor:pointer}
.hcol:hover .htip{display:block}
.htip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white);border-radius:4px;padding:8px 12px;font-size:12px;white-space:nowrap;z-index:100;min-width:180px;margin-bottom:6px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.htip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink)}
.htip-date{font-weight:700;color:var(--gold);margin-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.htip-kw{font-size:11px;color:rgba(255,255,255,.8);padding:2px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.htip-kw:last-child{border-bottom:none}
.htip-kw.aio{color:#b3d4f0}
.htip-kw.cited{color:#7ec89e}
.th-sort{cursor:pointer;user-select:none}
.th-sort:hover{color:var(--ink)}
.sort-arrow{font-size:10px;margin-left:3px;opacity:.5}
.sort-arrow.active{opacity:1;color:var(--gold-dim)}
.hbar{width:18px;border-radius:2px 2px 0 0;min-height:2px}
.hcol{display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0;position:relative;cursor:pointer}
.hcol:hover .htip{display:block}
.htip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white);border-radius:4px;padding:8px 12px;font-size:12px;white-space:nowrap;z-index:100;min-width:200px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.htip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink)}
.htip-date{font-weight:700;color:var(--gold-light);margin-bottom:5px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.htip-row{font-size:11px;padding:2px 0;display:flex;justify-content:space-between;gap:12px}
.htip-row.aio{color:#b3d4f0}
.htip-row.cited{color:#7ec89e}
.th-sort{cursor:pointer;user-select:none;white-space:nowrap}
.th-sort:hover{color:var(--ink)}
.sort-arr{font-size:10px;margin-left:3px;color:var(--gold-dim)}
.hdate{font-size:9px;color:var(--ink-muted);writing-mode:vertical-lr;transform:rotate(180deg);margin-top:4px}

/* ── Filters ── */
.filters{display:flex;gap:.35rem;margin-bottom:.875rem;flex-wrap:wrap}
.ftab{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--cream-dark);background:var(--white);color:var(--ink-muted);font-family:var(--sans)}
.ftab.active{background:var(--ink);color:var(--white);border-color:transparent}

/* ── Keyword table ── */
.tbl-wrap{background:var(--white);border:1px solid var(--cream-dark);border-radius:6px;overflow:hidden}
.tbl-count{padding:.625rem 1rem;font-size:12px;color:var(--ink-muted);border-bottom:1px solid var(--cream-dark)}
table.kw{width:100%;border-collapse:collapse}
table.kw th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-muted);padding:8px 12px;text-align:left;background:var(--cream);border-bottom:1px solid var(--cream-dark)}
table.kw td{padding:11px 12px;border-bottom:1px solid var(--cream-dark);font-size:14px;color:var(--ink-soft);vertical-align:top}
table.kw tr:last-child td{border-bottom:none}
table.kw tr:hover td{background:#faf8f4}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:3px;white-space:nowrap}
.badge.cited{background:var(--green-bg);color:var(--green)}
.badge.aio{background:var(--blue-bg);color:var(--blue)}
.badge.no-aio{background:var(--cream);color:var(--ink-muted)}
.badge.rank{background:var(--gold-muted);color:var(--gold-dim)}
.badge.no-rank{background:var(--cream);color:var(--ink-muted)}
.badge.err{background:var(--red-bg);color:var(--red)}

/* ── Our pages appearances ── */
.our-pages{display:flex;flex-direction:column;gap:4px;margin-top:5px}
.our-page{font-size:12px;display:flex;align-items:baseline;gap:5px}
.our-page-where{font-weight:600;color:var(--green);white-space:nowrap}
.our-page-link{color:var(--gold-dim);text-decoration:none;word-break:break-all}
.our-page-link:hover{text-decoration:underline}
.our-page-title{color:var(--ink-muted);font-size:11px}
.not-found{font-size:12px;color:var(--ink-muted);font-style:italic;margin-top:4px}

/* ── AIO sources ── */
.aio-srcs{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.aio-src{font-size:12px;color:var(--ink-muted);display:flex;gap:4px}
.aio-src a{color:var(--gold-dim);text-decoration:none}
.aio-src a.ours{color:var(--green);font-weight:600}
.aio-src a:hover{text-decoration:underline}
.btn-aio{font-size:12px;color:var(--gold-dim);background:none;border:none;cursor:pointer;font-family:var(--sans);padding:3px 0;text-decoration:underline;text-underline-offset:2px;margin-top:4px;display:block}

/* ── AIO Detail modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,20,16,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex}
.modal{background:var(--white);border-radius:6px;width:100%;max-width:740px;max-height:88vh;overflow-y:auto;border-top:3px solid var(--gold);box-shadow:0 16px 48px rgba(0,0,0,.18)}
.modal-hd{display:flex;align-items:flex-start;justify-content:space-between;padding:1.25rem 1.5rem .75rem;gap:1rem;border-bottom:1px solid var(--cream-dark)}
.modal-hd h2{font-family:var(--serif);font-size:1.35rem;font-weight:600;flex:1}
.modal-x{background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink-muted);line-height:1;padding:0;flex-shrink:0}
.modal-body{padding:1.25rem 1.5rem 1.5rem}
.modal-kw{font-size:13px;color:var(--ink-muted);margin-bottom:1rem}
.aio-fulltext{font-size:14px;line-height:1.75;color:var(--ink-soft);background:var(--cream);border-radius:4px;padding:1rem;margin-bottom:1.25rem;white-space:pre-wrap;max-height:300px;overflow-y:auto}
.src-heading{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-muted);margin-bottom:.625rem}
.src-row{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--cream-dark);font-size:13px}
.src-row:last-child{border-bottom:none}
.src-num{color:var(--ink-muted);font-size:12px;min-width:18px}
.src-domain{font-size:11px;color:var(--ink-muted)}
.src-row a{color:var(--gold-dim);text-decoration:none;word-break:break-all}
.src-row a.ours{color:var(--green);font-weight:600}
.src-row a:hover{text-decoration:underline}
.empty{text-align:center;padding:3rem;color:var(--ink-muted);font-size:14px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--cream-dark);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <div style="font-size:22px;font-weight:900;color:var(--blue);margin-bottom:16px">CP</div>
    <h2>Criminally Prolific</h2>
    <p>SEO Dashboard — internal use only</p>
    <input type="password" class="linput" id="pw" placeholder="Admin password">
    <button class="lbtn" onclick="doLogin()">Sign in →</button>
    <div class="lerr" id="lerr">Incorrect password</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div>
      <h1>SEO Dashboard</h1>
      <p id="lastChecked">83 keywords · criminallyprolific.com · Updated daily 6am UTC</p>
    </div>
    <div class="actions">
      <button class="btn" onclick="logout()">Sign out</button>
      <button class="btn gold" id="runBtn" onclick="runNow()">↻ Run now</button>
    </div>
  </div>

  <div class="sbar">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Loading…</span>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="hist" id="histWrap" style="display:none">
    <h3>30-day trend
      <span class="hist-legend">
        <span><span class="hdot" style="background:#b3d4f0"></span>AIO shown <span id="legend-aio" style="font-weight:700;color:var(--ink)"></span></span>
        <span><span class="hdot" style="background:var(--green)"></span>We appear <span id="legend-cited" style="font-weight:700;color:var(--green)"></span></span>
      </span>
    </h3>
    <div class="hchart" id="hchart"></div>
  </div>

  <div class="filters" id="filterBar"></div>

  <div class="tbl-wrap">
    <div class="tbl-count" id="tblCount"></div>
    <div id="tblBody"><div class="empty">Loading…</div></div>
  </div>
</div>

<!-- AIO detail modal -->
<div class="modal-bg" id="aioModal">
  <div class="modal">
    <div class="modal-hd">
      <h2>AI Overview</h2>
      <button class="modal-x" onclick="closeAio()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-kw" id="aioKw"></div>
      <div id="aioBody"></div>
    </div>
  </div>
</div>


<!-- AIO detail modal -->
<div class="modal-bg" id="aioModal">
  <div class="modal">
    <div class="modal-hd">
      <h2>AI Overview</h2>
      <button class="modal-x" onclick="closeAio()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-kw" id="aioKw"></div>
      <div id="aioBody"></div>
    </div>
  </div>
</div>

<script>
const SITE = 'criminallyprolific.com';
const PW_KEY = 'cp_seo_pw';
let apw='', allResults=[], curFilter='all';

const KEYWORD_GROUPS = [
  { page:'/company-boilerplate/', label:'Company Boilerplate', kws:['company boilerplate','company boilerplate examples','boilerplate','boilerplate content','what is a boilerplate','press release boilerplate','about the company boilerplate','boilerplate template','company description template','boiler plate'] },
  { page:'/cold-email-example/', label:'Cold Email Examples', kws:['cold email example','cold email examples','cold email','best cold email examples','cold email template','cold email tips','cold email 2026','cold email outreach examples'] },
  { page:'/press-release-email/', label:'Press Release Email', kws:['press release email example','press release email','press release subject line','subject line for press release email','how to send a press release email','press release email template','media pitch email'] },
  { page:'/find-anyones-email/', label:"Find Anyone's Email", kws:['find anyones email','find email address by name free','find all emails associated with my name free','how to find email address by name','find email address free','email lookup by name','find anyone email address free'] },
  { page:'/email-signatures/', label:'Email Signatures', kws:['email signature examples','email signature ideas','professional email signature','best email signature examples','email signature template','good email signature','email signature 2026'] },
  { page:'/how-to-pitch-journalists/', label:'Pitch Journalists', kws:['how to pitch journalists','pitch journalists','how to pitch a journalist','journalist pitch template','media pitch','how to pitch to press'] },
  { page:'/pr-pitch-angles/', label:'PR Pitch Angles', kws:['pr pitch angles','pitch angles for journalists','pr pitch ideas','unusual pr pitch angles','creative pr pitch'] },
  { page:'/pr-for-startups/', label:'PR for Startups', kws:['pr for startups','startup pr','how to do pr for a startup','startup press coverage','startup media coverage','how to get press coverage startup'] },
  { page:'/saas-pr/', label:'SaaS PR', kws:['saas pr','saas pr strategy','saas public relations','b2b saas pr','saas press coverage'] },
  { page:'/do-your-own-pr/', label:'Do Your Own PR', kws:['do your own pr','diy pr','how to do your own pr','pr without a pr agency','how to get press coverage without pr agency'] },
  { page:'/media-relations-strategy/', label:'Media Relations Strategy', kws:['media relations strategy','media relations','pr media strategy','how to build media relationships','journalist relationship building'] },
  { page:'/media-list-examples/', label:'Media List Examples', kws:['media list examples','media list','how to build a media list','journalist contact list','pr media list template'] },
  { page:'/marketing-communications-strategy/', label:'Marketing Comms Strategy', kws:['marketing communications strategy','marketing communications','marcom strategy','integrated marketing communications'] },
  { page:'/how-to-rank-higher-on-google/', label:'Rank Higher on Google', kws:['how to rank higher on google','rank higher on google','link building study','how to rank on google','google ranking tips 2026'] },
  { page:'/optimize-for-google-rankbrain/', label:'Optimize for RankBrain', kws:['optimize for google rankbrain','rankbrain seo','google rankbrain optimization','rankbrain ranking factors'] },
  { page:'/ranking-high-volume-keyword/', label:'Rank High Volume Keywords', kws:['how to rank for high volume keywords','ranking high volume keyword','rank competitive keyword 90 days','rank difficult keyword'] },
  { page:'/low-search-volume-keywords/', label:'Low Search Volume Keywords', kws:['low search volume keywords','long tail keywords strategy','low volume keyword seo','why target low volume keywords'] },
  { page:'/growth-hacking/', label:'Growth Hacking', kws:['growth hacking','growth hacking tactics','growth hacking examples','growth hacking strategies 2026','growth hacking tools'] },
  { page:'/50-growth-hacking-tools/', label:'50 Growth Hacking Tools', kws:['growth hacking tools','best growth hacking tools','marketing growth tools','growth tools for startups','50 growth hacking tools'] },
  { page:'/convert-website-visitors/', label:'Convert Website Visitors', kws:['how to convert website visitors','convert website visitors without forms','website visitor conversion','increase website conversion rate'] },
  { page:'/waste-money-on-facebook-ads/', label:'Facebook Ads Worth It?', kws:['are facebook ads worth it','facebook ads worth it 2026','waste money on facebook ads','facebook ads roi 2026','should i use facebook ads'] },
  { page:'/email-pitch-tips/', label:'Email Pitch Tips', kws:['email pitch tips','cold email pitch','how to pitch journalists by email','pr email tips','email pitch to journalist'] },
  { page:'/email-subject-lines/', label:'Email Subject Lines', kws:['cold email subject lines','email subject lines that get responses','best email subject lines','subject lines for cold email','email subject line examples'] },
  { page:'/email-signoffs/', label:'Email Sign-offs', kws:['email sign offs','best email sign offs','professional email sign off','email closing examples','how to end an email'] },
  { page:'/business-email-templates/', label:'Business Email Templates', kws:['business email templates','professional email templates','business email examples','email templates for business','formal email template'] },
  { page:'/sales-email-sequences/', label:'Sales Email Sequences', kws:['sales email sequences','email sequence examples','cold email sequence','sales email drip sequence','best sales email sequences'] },
  { page:'/gmail-mail-merge/', label:'Gmail Mail Merge', kws:['gmail mail merge','mail merge gmail','how to mail merge in gmail','gmail mail merge 2026','send personalized emails gmail'] },
  { page:'/grow-email-list/', label:'Grow Email List', kws:['how to grow email list','grow email list fast','email list building','grow newsletter subscribers','build email list from scratch'] },
  { page:'/grow-email-subscribers/', label:'Grow Email Subscribers', kws:['grow email subscribers','increase email subscribers','how to get more email subscribers','700 to 3000 subscribers','grow newsletter fast'] },
  { page:'/how-to-ask-for-business-in-an-email/', label:'Ask for Business in Email', kws:['how to ask for business in an email','ask for business email template','sales ask email','how to ask for a sale in email','closing email for business'] },
  { page:'/pitch-sell-your-app/', label:'Pitch & Sell Your App', kws:['how to pitch an app','how to sell your app','pitch app to investors','sell saas app','build app for acquisition'] },
];
const ALL_KWS = KEYWORD_GROUPS.flatMap(g => g.kws);


async function doLogin(){
  const pw=document.getElementById('pw').value.trim();
  if(!pw)return;
  const r=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).catch(()=>null);
  if(r&&r.ok){apw=pw;sessionStorage.setItem(PW_KEY,pw);showApp();}
  else document.getElementById('lerr').style.display='block';
}
function logout(){sessionStorage.removeItem(PW_KEY);location.reload();}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
const saved=sessionStorage.getItem(PW_KEY);
if(saved){
  fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:saved})})
    .then(r=>{if(r.ok){apw=saved;showApp();}else sessionStorage.removeItem(PW_KEY);}).catch(()=>{});
}

function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';loadResults();}

async function loadResults(){
  setStatus('amber','Fetching latest results…');
  try{
    const r=await fetch('/api/seo-track?action=results');
    if(!r.ok){setStatus('amber',`Server error ${r.status}`);renderEmpty();return;}
    const d=await r.json().catch(()=>null);
    if(d&&d.results&&d.results.keywords&&d.results.keywords.length){
      allResults=d.results.keywords.filter(k=>ALL_KWS.some(ak=>ak.toLowerCase()===k.keyword.toLowerCase()));
      if(!allResults.length) allResults=d.results.keywords;
      renderKpis();renderFilters();renderTable(curFilter);renderHistory(d.history||[]);
      const dt=new Date(d.results.checkedAt);
      const dtStr=isNaN(dt)?'—':`${dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})} at ${dt.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}`;
      document.getElementById('lastChecked').textContent=`criminallyprolific.com · 31 articles · 166 keywords · Last checked: ${dtStr}`;
      setStatus('green',`${allResults.length} of 166 keywords have data`);
    } else {renderEmpty();setStatus('amber','No data yet — click "Run now" to fetch rankings');}
  }catch(e){setStatus('amber','Error: '+e.message);renderEmpty();}
}

function renderEmpty(){
  document.getElementById('kpis').innerHTML='';
  document.getElementById('tblBody').innerHTML='<div class="empty">No keyword data yet.<br><br>Click "↻ Run now" to check all 166 keywords.<br><span style="font-size:12px;color:var(--ink-muted)">First run takes ~15 minutes.</span></div>';
  document.getElementById('tblCount').textContent='0 keywords';
}

async function runNow(){
  const btn=document.getElementById('runBtn');
  btn.disabled=true;
  const today=new Date().toISOString().slice(0,10);
  const resultMap={};
  allResults.forEach(r=>{ resultMap[r.keyword.toLowerCase()]=r; });
  const toCheck=ALL_KWS.filter(kw=>{
    const r=resultMap[kw.toLowerCase()];
    if(!r||!r.checkedAt) return true;
    return r.checkedAt.slice(0,10)!==today;
  });
  if(toCheck.length===0){
    setStatus('green','All 166 keywords already checked today ✓');
    btn.disabled=false; btn.innerHTML='↻ Run now'; return;
  }
  let progEl=document.getElementById('runProgress');
  if(!progEl){
    progEl=document.createElement('div'); progEl.id='runProgress'; progEl.style.cssText='margin-bottom:12px';
    progEl.innerHTML=`<div style="font-size:12px;color:var(--ink-muted);margin-bottom:4px" id="runProgressLabel"></div>
      <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden">
        <div id="runProgressFill" style="height:100%;background:var(--blue);border-radius:2px;transition:width .3s;width:0%"></div>
      </div>`;
    document.getElementById('filterBar').before(progEl);
  }
  progEl.style.display='block';
  let done=0; const total=toCheck.length; const skipped=ALL_KWS.length-total;
  for(const kw of toCheck){
    document.getElementById('runProgressFill').style.width=Math.round((done/total)*100)+'%';
    document.getElementById('runProgressLabel').textContent=`Checking ${done+1}/${total} keywords${skipped?' · '+skipped+' already checked today':''}…`;
    btn.innerHTML=`<span class="spinner"></span> ${done}/${total}`;
    await fetch(`/api/seo-track?action=check&kw=${encodeURIComponent(kw)}&password=${encodeURIComponent(apw)}`).catch(()=>null);
    done++;
  }
  document.getElementById('runProgressFill').style.width='100%';
  document.getElementById('runProgressLabel').textContent='Saving results…';
  await fetch(`/api/seo-track?action=finish&password=${encodeURIComponent(apw)}`).catch(()=>null);
  setTimeout(()=>{ if(progEl) progEl.style.display='none'; },3000);
  btn.disabled=false; btn.innerHTML='↻ Run now'; loadResults();
}

function setStatus(state,txt){
  document.getElementById('statusDot').className='dot'+(state==='green'?' green':state==='amber'?' amber':'');
  document.getElementById('statusText').textContent=txt;
}

function renderKpis(){
  const ranked=allResults.filter(r=>r.organic_rank).length;
  const inAio=allResults.filter(r=>r.in_aio).length;
  const cited=allResults.filter(r=>r.site_cited).length;
  const total=allResults.length;
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><div class="kpi-l">Keywords</div><div class="kpi-v">${total}<span style="font-size:14px;color:var(--ink-muted)">/166</span></div><div class="kpi-s">checked</div></div>
    <div class="kpi"><div class="kpi-l">Articles</div><div class="kpi-v">31</div><div class="kpi-s">tracked</div></div>
    <div class="kpi"><div class="kpi-l">Organic Rank</div><div class="kpi-v ${ranked>0?'green':''}">${ranked}</div><div class="kpi-s">in top 10</div></div>
    <div class="kpi"><div class="kpi-l">In AIO</div><div class="kpi-v ${inAio>0?'blue':''}">${inAio}</div><div class="kpi-s">AI overviews</div></div>
    <div class="kpi"><div class="kpi-l">AIO Cited</div><div class="kpi-v ${cited>0?'green':''}">${cited}</div><div class="kpi-s">we appear</div></div>
  `;
}

function renderHistory(history){
  const w=document.getElementById('histWrap');
  if(!history||!history.length){w.style.display='none';return;}
  w.style.display='block';
  const max=Math.max(...history.map(h=>h.ranked||h.in_aio||1),1);
  document.getElementById('hchart').innerHTML=history.slice(0,30).reverse().map(h=>`
    <div class="hcol">
      <div class="hbar" style="height:${Math.max(4,((h.ranked||h.in_aio||0)/max)*60)}px;background:var(--blue)"></div>
      <div class="hdate">${(h.date||'').slice(5)}</div>
      <div class="htip">${h.date}<br>Ranking: ${h.ranked||0} · AIO: ${h.in_aio||0}</div>
    </div>`).join('');
}

function renderFilters(){
  const today=new Date().toISOString().slice(0,10);
  const checked=allResults.length;
  const allKwCount=ALL_KWS.length;
  const appearing=allResults.filter(r=>r.our_pages&&r.our_pages.length>0).length;
  const unchecked=allKwCount-checked;
  document.getElementById('filterBar').innerHTML=[
    {id:'all',       label:`All (${allKwCount})`},
    {id:'we_appear', label:`✓ Appear (${appearing})`},
    {id:'organic',   label:'Organic rank'},
    {id:'cited',     label:'In AIO'},
    {id:'no_us',     label:'Not ranking'},
    {id:'unchecked', label:`Not checked (${unchecked})`},
  ].map(f=>`<button class="ftab ${curFilter===f.id?'active':''}" onclick="setF('${f.id}',this)">${esc(f.label)}</button>`).join('');
}
function setF(f,el){curFilter=f;document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderTable(f);}


function renderTable(filter){
  const today=new Date().toISOString().slice(0,10);
  const resultMap={};
  allResults.forEach(r=>{ resultMap[r.keyword.toLowerCase()]=r; });

  // Flatten all keywords with group info
  let allKws=[];
  for(const g of KEYWORD_GROUPS){
    for(const kw of g.kws){
      allKws.push({kw, g, r: resultMap[kw.toLowerCase()]||null});
    }
  }

  // Apply filter
  let filtered=allKws;
  if(filter==='we_appear') filtered=allKws.filter(({r})=>r&&r.our_pages&&r.our_pages.length>0);
  else if(filter==='organic') filtered=allKws.filter(({r})=>r&&r.organic_rank);
  else if(filter==='cited') filtered=allKws.filter(({r})=>r&&r.site_cited);
  else if(filter==='no_us') filtered=allKws.filter(({r})=>r&&(!r.our_pages||!r.our_pages.length));
  else if(filter==='unchecked') filtered=allKws.filter(({r})=>!r);

  // Sort: appearing items first (organic rank asc), then AIO cited, then rest
  if(filter==='we_appear'||filter==='all'){
    filtered=[...filtered].sort((a,b)=>{
      const aApp=a.r&&a.r.our_pages&&a.r.our_pages.length?0:1;
      const bApp=b.r&&b.r.our_pages&&b.r.our_pages.length?0:1;
      if(aApp!==bApp) return aApp-bApp;
      const aPos=a.r&&a.r.organic_rank?a.r.organic_rank:999;
      const bPos=b.r&&b.r.organic_rank?b.r.organic_rank:999;
      return aPos-bPos;
    });
  }

  document.getElementById('tblCount').textContent=`${filtered.length} of ${ALL_KWS.length} keywords`;

  if(!filtered.length){
    document.getElementById('tblBody').innerHTML='<div class="empty">No keywords match this filter</div>';
    return;
  }

  const showGrouped=(filter==='all'||filter==='unchecked'||filter==='no_us');

  const thead=`<thead><tr>
    <th style="width:24%">Keyword</th>
    <th>Article Page</th>
    <th style="width:64px">Checked</th>
    <th style="width:52px">Today?</th>
    <th style="width:76px">AIO</th>
    <th>Ranking URL</th>
    <th style="width:76px">Position</th>
  </tr></thead><tbody>`;

  function kwRow({kw,g,r}){
    if(!r) return`<tr style="opacity:.45">
      <td style="font-size:12px">${esc(kw)}</td>
      <td style="font-size:11px;color:var(--ink-muted)">${g.page}</td>
      <td colspan="5" style="font-size:11px;color:var(--ink-muted);font-style:italic">Not checked yet</td>
    </tr>`;
    const dt=r.checkedAt?r.checkedAt.slice(5,10):'—';
    const checkedToday=r.checkedAt&&r.checkedAt.slice(0,10)===today;
    const todayBadge=checkedToday
      ?`<span style="font-size:9px;font-weight:700;color:var(--green);background:var(--green-bg);padding:2px 5px;border-radius:3px">✓</span>`
      :`<span style="font-size:9px;color:var(--ink-muted)">—</span>`;
    const aio=r.error?`<span class="badge err" style="font-size:9px">Err</span>`
      :r.in_aio?`<span class="badge aio" style="font-size:9px">✓ AIO</span>`
      :`<span class="badge no-aio" style="font-size:9px">—</span>`;
    let rankCell='';
    if(r.our_pages&&r.our_pages.length){
      const sorted=[...r.our_pages].sort((a,b)=>{
        const o=x=>x.where.startsWith('Organic')?0:x.where.startsWith('AIO')?1:2;
        return o(a)-o(b);
      });
      rankCell=sorted.map(p=>{
        const col=p.where.startsWith('AIO')?'var(--green)':p.where.startsWith('Organic')?'var(--blue)':'var(--amber)';
        const lnk=p.link?`<a href="${esc(p.link)}" target="_blank" style="color:${col};font-size:11px;word-break:break-all">${esc(p.link)}</a>`
          :`<span style="color:${col};font-size:11px">${esc(p.title||p.where)}</span>`;
        return`<div style="display:flex;gap:4px;align-items:flex-start;margin-bottom:2px">
          <span style="font-size:9px;font-weight:800;color:${col};white-space:nowrap;min-width:64px;padding-top:2px">${esc(p.where)}</span>${lnk}
        </div>`;
      }).join('');
    } else {
      rankCell=`<span style="font-size:11px;color:var(--ink-muted);font-style:italic">Not ranking</span>`;
    }
    const orgBadge=r.organic_rank?`<span class="badge rank">#${r.organic_rank}</span>`:`<span class="badge no-rank">—</span>`;
    const hl=(r.site_cited||(r.our_pages&&r.our_pages.length>0)||r.organic_rank!=null)
      ?'background:linear-gradient(90deg,#edfaf1 0%,transparent 70%)'
      :r.in_aio?'background:linear-gradient(90deg,#fffbeb 0%,transparent 70%)'
      :'';
    const isYT=g.page&&g.page.startsWith('https://');
    const pageLink=isYT
      ?`<a href="${esc(g.page)}" target="_blank" style="color:#c00;font-size:11px">▶ YouTube</a>`
      :`<a href="https://criminallyprolific.com${g.page}" target="_blank" style="color:var(--blue);font-size:11px">${g.page}</a>`;
    return`<tr style="${hl}">
      <td><strong style="font-size:13px">${esc(kw)}</strong></td>
      <td>${pageLink}</td>
      <td style="color:var(--ink-muted);font-size:11px">${dt}</td>
      <td style="text-align:center">${todayBadge}</td>
      <td>${aio}</td>
      <td>${rankCell}</td>
      <td>${orgBadge}</td>
    </tr>`;
  }

  let html_out='';
  if(showGrouped){
    const byGroup={};
    filtered.forEach(item=>{
      if(!byGroup[item.g.label]) byGroup[item.g.label]={g:item.g,items:[]};
      byGroup[item.g.label].items.push(item);
    });
    html_out=`<table class="kw">${thead}`;
    for(const key of Object.keys(byGroup)){
      const {g,items}=byGroup[key];
      html_out+=`<tr><td colspan="7" class="page-group">📄 ${esc(g.label)} — <a href="https://criminallyprolific.com${g.page}" target="_blank" style="color:var(--blue);font-weight:400;font-size:11px;text-transform:none;letter-spacing:0">${g.page}</a></td></tr>`;
      html_out+=items.map(kwRow).join('');
    }
    html_out+='</table>';
  } else {
    html_out=`<table class="kw">${thead}`+filtered.map(kwRow).join('')+'</table>';
  }
  document.getElementById('tblBody').innerHTML=html_out;
}

// ── AIO modal ─────────────────────────────────────────────────────────────────
function openAio(btn) {
  let r;
  try { r = JSON.parse(btn.dataset.r || '{}'); } catch { return; }
  document.getElementById('aioKw').textContent = `Keyword: "${r.keyword}" · checked ${r.checkedAt ? new Date(r.checkedAt).toLocaleString() : '—'}`;

  const sources = (r.aio_sources || []).map((s, i) => {
    const isOurs = s.link && s.link.includes('criminallyprolific.com');
    let dom = '';
    try { dom = new URL(s.link).hostname.replace('www.',''); } catch { dom = s.link || ''; }
    return `<div class="src-row">
      <span class="src-num">${i+1}</span>
      <div>
        <a href="${esc(s.link)}" target="_blank" rel="noopener" class="${isOurs?'ours':''}">${esc(s.title || dom)}</a>
        <div class="src-domain">${esc(dom)}${isOurs?' ← our site':''}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('aioBody').innerHTML = `
    ${r.aio_text
      ? `<div class="aio-fulltext">${esc(r.aio_text)}</div>`
      : '<p style="color:var(--ink-muted);font-size:13px;margin-bottom:1rem">No AIO text captured — re-run to fetch.</p>'}
    ${sources
      ? `<div class="src-heading">Sources cited in AI Overview (${(r.aio_sources||[]).length})</div>${sources}`
      : '<p style="color:var(--ink-muted);font-size:13px">No sources recorded</p>'}`;

  document.getElementById('aioModal').classList.add('open');
}

function closeAio() { document.getElementById('aioModal').classList.remove('open'); }
document.getElementById('aioModal').addEventListener('click', e => {
  if (e.target === document.getElementById('aioModal')) closeAio();
});

// ── Utilities ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function slugify(url) {
  try {
    const u = new URL(url);
    return u.hostname.replace('www.','') + u.pathname;
  } catch { return url; }
}
