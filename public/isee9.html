  app.innerHTML = `<div class="bar"><div class="bar-in"><span class="name">${s.name}</span><span id="count" class="small muted"></span>
    <span class="row"><span id="clock" class="clock"></span><button class="btn" data-act="ask-end">End section</button></span></div></div>
    <div class="test ${split ? 'split' : ''}">
      ${split ? `<div class="split-grid"><div class="sheet passage" id="passage" tabindex="0" aria-label="Passage"></div><div id="qpane" class="stack"></div></div>` : `<div id="qpane" class="stack"></div>`}
      <div class="sheet stack"><div class="navgrid" id="nav"></div>
      <div class="legend"><span><i class="l1"></i>Answered</span><span><i></i>Not answered</span><span><i class="l2"></i>Flagged</span></div></div>
    </div><div id="dlg"></div>`;
  question(); clock();
}
function question() {
  const s = sec(), q = s.questions[st.qi], a = st.ans[s.id][st.qi], fl = st.flag[s.id][st.qi];
  if (s.passages && q.p !== shownPassage) { const el = document.getElementById('passage'); el.innerHTML = passageHTML(s, q.p); el.scrollTop = 0; shownPassage = q.p; }
  document.getElementById('count').textContent = `Question ${st.qi + 1} of ${s.questions.length}`;
  const pnote = s.passages ? `<span class="eyebrow">Passage ${q.p + 1} of ${s.passages.length}</span>` : '';
  document.getElementById('qpane').innerHTML = `<div class="sheet stack">${pnote}<div class="row spread"><h3>Question ${st.qi + 1}</h3></div>${stem(q)}
    <ul class="choices">${choicesOf(q).map((c, i) => `<li><button class="choice ${a === i ? 'on' : ''}" data-act="pick" data-i="${i}" aria-pressed="${a === i}"><span class="oval">${L[i]}</span><span>${c}</span></button></li>`).join('')}</ul></div>
    <div class="row spread"><button class="btn" data-act="prev" ${st.qi === 0 ? 'disabled' : ''}>Previous</button>
    <button class="btn ${fl ? 'flagged' : ''}" data-act="flag" aria-pressed="${!!fl}">${fl ? 'Flagged' : 'Flag for review'}</button>
    ${st.qi === s.questions.length - 1 ? `<button class="btn primary" data-act="ask-end">Finish section</button>` : `<button class="btn primary" data-act="next">Next</button>`}</div>`;
  document.getElementById('nav').innerHTML = s.questions.map((_, i) => `<button class="nb ${st.ans[s.id][i] !== null ? 'done' : ''} ${st.flag[s.id][i] ? 'fl' : ''} ${i === st.qi ? 'cur' : ''}" data-act="goto" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join('');
}
function clock() {
  const el = document.getElementById('clock'); if (!el) return;
  if (st.mode === 'untimed') { el.textContent = 'Untimed'; return; }
  el.textContent = fmt(st.rem); el.classList.toggle('warn', st.rem <= 300);
}
function runTimer() {
  clearInterval(tick); tick = null;
  if (st.mode === 'untimed') return;
  tick = setInterval(() => { st.rem--; clock(); if (st.rem % 5 === 0) save(); if (st.rem <= 0) endSection(); }, 1000);
}
function askEnd() {
  const s = sec(); let msg;
  if (s.questions) { const left = st.ans[s.id].filter(x => x === null).length; msg = left ? `You have <strong>${left} unanswered question${left === 1 ? '' : 's'}</strong>. There is no penalty for guessing, so it is worth filling them in.` : 'You have answered every question.'; }
  else msg = 'Your essay will be saved for you to review.';
  const timeLeft = st.mode !== 'untimed' && st.rem > 0 ? ` You still have ${fmt(st.rem)} left.` : '';
  document.getElementById('dlg').innerHTML = `<div class="overlay"><div class="dialog stack" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h2 id="dlg-t">End this section?</h2><p>${msg}${timeLeft}</p><p class="small muted">You will not be able to return to this section.</p><div class="row"><button class="btn" data-act="close-dlg">Keep working</button><button class="btn primary" data-act="end">End section</button></div></div></div>`;
}
function endSection() {
  clearInterval(tick); tick = null;
  const ta = document.getElementById('essay'); if (ta) st.essay = ta.value;
  if (st.si === SECS.length - 1) { st.finished = true; st.view = 'results'; }
  else { st.si++; st.qi = 0; st.view = 'intro'; }
  save(); render(); window.scrollTo(0, 0);
}

/* ---------- essay ---------- */
function essay() {
  const s = sec();
  app.innerHTML = `<div class="bar"><div class="bar-in"><span class="name">${s.name}</span><span id="wc" class="small muted"></span>
    <span class="row"><span id="clock" class="clock"></span><button class="btn" data-act="ask-end">Finish essay</button></span></div></div>
    <div class="test"><div class="sheet stack"><span class="eyebrow">Prompt</span><p class="qtext">${s.prompt}</p>
    <p class="small muted">${s.note}</p></div>
    <label for="essay" class="eyebrow">Your essay</label><textarea id="essay" spellcheck="false" placeholder="Take a few minutes to plan, then write.">${esc(st.essay)}</textarea></div><div id="dlg"></div>`;
  clock(); wc();
}
function wc() { const ta = document.getElementById('essay'); if (!ta) return; const n = (ta.value.trim().match(/\S+/g) || []).length; document.getElementById('wc').textContent = n + (n === 1 ? ' word' : ' words'); }

/* ---------- results ---------- */
function score(s) {
  const a = st.ans[s.id]; let right = 0; const topics = {};
  s.questions.forEach((q, i) => { const t = topics[q.t] || (topics[q.t] = { right: 0, total: 0 }); t.total++; if (a[i] === q.a) { right++; t.right++; } });
  return { right, total: s.questions.length, topics };
}
function reviewItem(s, i, showPassage) {
  const q = s.questions[i], a = st.ans[s.id][i];
  const status = a === null ? `<span class="pill">Not answered</span>` : a === q.a ? `<span class="pill ok">Correct</span>` : `<span class="pill low">Incorrect</span>`;
  const ch = choicesOf(q).map((c, k) => { const cls = k === q.a ? 'right' : (k === a ? 'wrong' : ''); const tag = k === q.a ? (k === a ? 'Your answer · correct' : 'Correct answer') : (k === a ? 'Your answer' : ''); return `<li><div class="choice ${cls}"><span class="oval">${L[k]}</span><span>${c}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</div></li>`; }).join('');
  const pass = showPassage && s.passages ? `<details><summary>Show passage ${q.p + 1}</summary><div class="passage" style="margin-top:10px;max-height:none">${passageHTML(s, q.p)}</div></details>` : '';
  return `<div class="item"><div class="row spread"><h3>Question ${i + 1} <span class="small muted" style="font-family:var(--ui);font-weight:400">· ${q.t}</span></h3>${status}</div>${pass}${stem(q)}<ul class="choices">${ch}</ul><p class="why">${q.e}</p></div>`;
}
function results() {
  const scored = SECS.filter(s => s.questions), sc = scored.map(score);
  const rows = scored.map((s, i) => { const p = Math.round(100 * sc[i].right / sc[i].total); return `<tr><td>${s.name}</td><td class="num">${sc[i].right} / ${sc[i].total}</td><td class="num">${p}%</td><td><div class="meter"><span style="width:${p}%"></span></div></td></tr>`; }).join('');
  const weak = [];
  const topicRows = scored.map((s, i) => Object.entries(sc[i].topics).map(([t, v]) => { const p = Math.round(100 * v.right / v.total); if (p < 60) weak.push(`${t} (${s.name})`); return `<tr><td>${s.name}</td><td>${t}</td><td class="num">${v.right} / ${v.total}</td><td><span class="pill ${p < 60 ? 'low' : p >= 80 ? 'ok' : ''}">${p}%</span></td></tr>`; }).join('')).join('');
  const s = scored[reviewTab]; let idx = s.questions.map((_, i) => i);
  if (missedOnly) idx = idx.filter(i => st.ans[s.id][i] !== s.questions[i].a);
  const items = idx.length ? idx.map(i => reviewItem(s, i, true)).join('') : `<p class="muted">Nothing missed in this section.</p>`;
  const es = SECS[SECS.length - 1];
  app.innerHTML = `<div class="wrap">
    <header class="stack"><span class="eyebrow">Practice Test 1 · results</span><h1>Your scores</h1></header>
    <section class="sheet stack"><div class="scroll-x"><table><thead><tr><th>Section</th><th class="num">Correct</th><th class="num">Percent</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small muted">These are raw scores. The real ISEE converts each raw score to a scaled score (760–940), a percentile and a stanine (1–9) by comparing you with other applicants to the same grade over the past three years. That comparison data belongs to ERB, so a practice test cannot give you a true stanine. Use these scores to see which sections and topics need the most work.</p></section>
    <section class="sheet stack"><h2>By topic</h2>${weak.length ? `<p>Study first: <strong>${weak.join(', ')}</strong>.</p>` : `<p>No topic fell below 60%.</p>`}
    <div class="scroll-x"><table><thead><tr><th>Section</th><th>Topic</th><th class="num">Correct</th><th>Percent</th></tr></thead><tbody>${topicRows}</tbody></table></div></section>
    <section class="sheet stack"><h2>Review every question</h2>
      <div class="row spread"><div class="tabs">${scored.map((x, i) => `<button class="tab ${i === reviewTab ? 'on' : ''}" data-act="tab" data-i="${i}">${x.name}</button>`).join('')}</div>
      <label for="missed" class="small row" style="gap:6px"><input type="checkbox" id="missed" ${missedOnly ? 'checked' : ''}> Missed or skipped only</label></div>
      <div class="stack" style="gap:18px">${items}</div></section>
    <section class="sheet stack"><h2>Your essay</h2><p class="small muted">The essay is not scored. A copy is sent to each school you apply to. Prompt: ${es.prompt}</p>
      ${st.essay.trim() ? `<div class="essay-out">${esc(st.essay)}</div><div class="row"><button class="btn" data-act="copy-essay">Copy essay</button><span id="copied" class="small muted"></span></div>` : `<p class="muted">No essay was written.</p>`}
      <div class="stack small"><strong>Read it back and ask:</strong><ul style="margin:0;padding-left:1.2em"><li>Does the first paragraph answer the prompt directly?</li><li>Does each paragraph have one clear point with a specific example from your own life?</li><li>Is there a short conclusion that says what you learned or why it matters?</li><li>Did you leave two minutes to fix spelling and punctuation?</li></ul></div></section>
    <div class="row"><button class="btn" data-act="home">Back to start</button><button class="btn" data-act="reset">Start over</button></div><div id="dlg"></div></div>`;
}

/* ---------- one-page view ---------- */
function paper() {
  let out = `<div class="wrap"><header class="stack"><span class="eyebrow">All questions on one page</span><h1>ISEE Upper Level Practice Test 1</h1><p class="noprint"><a href="#">Back to the timed test</a></p></header>`;
  SECS.forEach((s, si) => {
    out += `<section class="sheet stack"><span class="eyebrow">Section ${si + 1} · ${s.minutes} minutes</span><h2>${s.name}</h2><p class="small muted">${s.intro}</p>`;
    if (!s.questions) { out += `<p class="qtext">${s.prompt}</p><p class="small muted">${s.note}</p></section>`; return; }
    let lastP = -1;
    s.questions.forEach((q, i) => {
      if (s.passages && q.p !== lastP) { out += `<div class="item stack"><span class="eyebrow">Passage ${q.p + 1}</span><div class="passage" style="max-height:none">${passageHTML(s, q.p)}</div></div>`; lastP = q.p; }
      out += `<div class="item"><h3>${i + 1}.</h3>${stem(q)}<ul class="choices">${choicesOf(q).map((c, k) => `<li><div class="choice"><span class="oval">${L[k]}</span><span>${c}</span></div></li>`).join('')}</ul></div>`;
    });
    out += `</section>`;
  });
  out += `<section class="sheet stack"><h2>Answer key</h2>`;
  SECS.filter(s => s.questions).forEach(s => { out += `<h3>${s.name}</h3><div class="key">${s.questions.map((q, i) => `<div>${i + 1}. ${L[q.a]}</div>`).join('')}</div>`; });
  out += `</section></div>`;
  app.innerHTML = out;
}

/* ---------- routing and events ---------- */
function render() {
  if (location.hash === '#paper') { paper(); return; }
  if (st.view === 'home') home();
  else if (st.view === 'intro') intro();
  else if (st.view === 'section') { sectionShell(); if (!tick) runTimer(); }
  else if (st.view === 'essay') { essay(); if (!tick) runTimer(); }
  else if (st.view === 'results') results();
}
function confirmReset() {
  const host = document.getElementById('dlg') || app.appendChild(Object.assign(document.createElement('div'), { id: 'dlg' }));
  host.innerHTML = `<div class="overlay"><div class="dialog stack" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h2 id="dlg-t">Start over?</h2><p>This erases every answer and the essay saved in this browser.</p><div class="row"><button class="btn" data-act="close-dlg">Cancel</button><button class="btn primary" data-act="do-reset">Erase and start over</button></div></div></div>`;
}
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i, s = sec();
  switch (act) {
    case 'begin': st.started = true; st.si = 0; st.view = 'intro'; save(); render(); window.scrollTo(0, 0); break;
    case 'resume': render0(); break;
    case 'results': st.view = 'results'; render(); window.scrollTo(0, 0); break;
    case 'home': st.view = 'home'; render(); window.scrollTo(0, 0); break;
    case 'reset': confirmReset(); break;
    case 'do-reset': clearInterval(tick); tick = null; st = fresh(); save(); render(); window.scrollTo(0, 0); break;
    case 'start-section': st.rem = Math.round(s.minutes * 60 * MODES[st.mode].mult); st.qi = 0; st.view = s.questions ? 'section' : 'essay'; save(); render(); window.scrollTo(0, 0); break;
    case 'pick': st.ans[s.id][st.qi] = st.ans[s.id][st.qi] === i ? null : i; save(); question(); break;
    case 'flag': st.flag[s.id][st.qi] = !st.flag[s.id][st.qi]; save(); question(); break;
    case 'prev': if (st.qi > 0) { st.qi--; question(); } break;
    case 'next': if (st.qi < s.questions.length - 1) { st.qi++; question(); } break;
    case 'goto': st.qi = i; question(); break;
    case 'ask-end': askEnd(); break;
    case 'close-dlg': document.getElementById('dlg').innerHTML = ''; break;
    case 'end': endSection(); break;
    case 'tab': reviewTab = i; results(); break;
    case 'copy-essay': { const out = document.getElementById('copied'); try { navigator.clipboard.writeText(st.essay).then(() => { out.textContent = 'Copied.'; }, () => { out.textContent = 'Copy was blocked. Select the text and copy it by hand.'; }); } catch (err) { out.textContent = 'Copy was blocked. Select the text and copy it by hand.'; } break; }
  }
});
// "Resume" returns to wherever the test was left: the saved view is kept in st.resume while the start page is showing.
function render0() { st.view = st.resume || 'intro'; render(); window.scrollTo(0, 0); }
app.addEventListener('change', e => {
  if (e.target.name === 'mode') { st.mode = e.target.value; save(); }
  if (e.target.id === 'missed') { missedOnly = e.target.checked; results(); }
});
app.addEventListener('input', e => { if (e.target.id === 'essay') { st.essay = e.target.value; wc(); } });
document.addEventListener('keydown', e => {
  if (st.view !== 'section' || location.hash === '#paper' || e.target.tagName === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector('.overlay')) { if (e.key === 'Escape') document.getElementById('dlg').innerHTML = ''; return; }
  const s = sec(), k = e.key.toLowerCase(), n = 'abcd'.indexOf(k);
  if (k.length === 1 && n >= 0) { st.ans[s.id][st.qi] = st.ans[s.id][st.qi] === n ? null : n; save(); question(); }
  else if (e.key === 'ArrowRight' && st.qi < s.questions.length - 1) { st.qi++; question(); }
  else if (e.key === 'ArrowLeft' && st.qi > 0) { st.qi--; question(); }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

st = load() || fresh();
// After a reload, an unfinished test opens on the start page with a Resume button; the clock stays paused until then.
if (st.started && !st.finished && st.view !== 'home') { st.resume = st.view; st.view = 'home'; }
else if (st.finished) st.view = 'results';
render();
</script>
</body>
</html>
