 deal."},{"t":"Sentence completion","q":"Although the twins look <span class=\"blank\"><\/span>, their personalities could not be more different.","c":["unusual","cheerful","identical","older"],"a":2,"e":"\"Although\" sets up a contrast with \"different.\" They look exactly alike: identical."},{"t":"Sentence completion","q":"The scientist repeated the experiment several times to <span class=\"blank\"><\/span> that her results were correct.","c":["forget","doubt","announce","verify"],"a":3,"e":"Repeating an experiment is a way to check, or verify, the results."},{"t":"Sentence completion","q":"After weeks without rain, the once-green lawn had become dry and <span class=\"blank\"><\/span>.","c":["lush","damp","brittle","colorful"],"a":2,"e":"Grass with no water becomes dry and easily broken, which is what \"brittle\" means."},{"t":"Sentence completion","q":"The coach praised the team for its <span class=\"blank\"><\/span>; the players never gave up, even when they were far behind.","c":["perseverance","hesitation","talent","luck"],"a":0,"e":"The second half defines the missing word: never giving up is perseverance."},{"t":"Sentence completion","q":"The instructions were so <span class=\"blank\"><\/span> that no one could figure out how to assemble the bookshelf.","c":["simple","confusing","brief","helpful"],"a":1,"e":"If no one could follow the instructions, they must have been confusing."},{"t":"Sentence completion","q":"Marcus was <span class=\"blank\"><\/span> to try the unfamiliar food, but after one bite he asked for more.","c":["eager","proud","certain","reluctant"],"a":3,"e":"\"But\" signals a change. He ended up liking it, so at first he was unwilling: reluctant."},{"t":"Sentence completion","q":"The storm caused <span class=\"blank\"><\/span> damage, flooding streets and knocking down power lines across the city.","c":["minor","extensive","invisible","welcome"],"a":1,"e":"Damage spread across the whole city is widespread, or extensive."},{"t":"Sentence completion","q":"Unlike her brother, who spends money as soon as he earns it, Priya is <span class=\"blank\"><\/span> and saves most of her allowance.","c":["thrifty","careless","generous","wealthy"],"a":0,"e":"\"Unlike\" contrasts Priya with a spender. Someone who saves carefully is thrifty."},{"t":"Sentence completion","q":"The speaker's voice was barely <span class=\"blank\"><\/span> above the noise of the crowd.","c":["visible","audible","pleasant","loud"],"a":1,"e":"Audible means able to be heard. A voice cannot be \"visible,\" and \"barely loud\" does not fit the meaning."},{"t":"Sentence completion","q":"The detective found the suspect's story <span class=\"blank\"><\/span> because several details did not match the evidence.","c":["convincing","amusing","familiar","suspicious"],"a":3,"e":"A story that does not match the evidence causes doubt, so it is suspicious."},{"t":"Sentence completion","q":"To avoid <span class=\"blank\"><\/span> the sleeping baby, they whispered and walked on tiptoe.","c":["feeding","amusing","disturbing","ignoring"],"a":2,"e":"People whisper and tiptoe so that they do not wake, or disturb, someone who is asleep."},{"t":"Sentence completion","q":"The old bridge was declared <span class=\"blank\"><\/span> and closed to traffic until repairs could be made.","c":["unsafe","scenic","narrow","historic"],"a":0,"e":"A bridge is closed for repairs when it is dangerous to cross."},{"t":"Sentence completion","q":"The two countries signed a treaty to end the war and <span class=\"blank\"><\/span> peace.","c":["delay","oppose","establish","question"],"a":2,"e":"A treaty that ends a war sets up, or establishes, peace."},{"t":"Sentence completion","q":"The author's <span class=\"blank\"><\/span> descriptions made readers feel as if they were standing in the rain forest themselves.","c":["dull","brief","confusing","vivid"],"a":3,"e":"Vivid descriptions are so clear and detailed that readers can picture the scene."},{"t":"Sentence completion","q":"Because the directions were <span class=\"blank\"><\/span>, we found the house without any trouble.","c":["precise","vague","late","lengthy"],"a":0,"e":"Finding the house easily means the directions were exact, or precise. Vague directions would cause trouble."},{"t":"Sentence completion","q":"The puppy was so <span class=\"blank\"><\/span> that it knocked over a lamp while racing around the living room.","c":["obedient","energetic","drowsy","shy"],"a":1,"e":"A puppy racing around the room is full of energy."},{"t":"Sentence completion","q":"The mayor's decision was <span class=\"blank\"><\/span>; nearly everyone in town disagreed with it.","c":["wise","popular","unpopular","expected"],"a":2,"e":"A decision that nearly everyone disagrees with is unpopular."},{"t":"Sentence completion","q":"Rather than <span class=\"blank\"><\/span> the argument, Lena calmly suggested a compromise.","c":["settle","forget","end","escalate"],"a":3,"e":"\"Rather than\" means she did the opposite of the missing word. Suggesting a compromise calms things down, so the missing word means to make worse: escalate."},{"t":"Sentence completion","q":"The desert appears <span class=\"blank\"><\/span> at midday, but at night it comes alive with animals searching for food.","c":["crowded","lifeless","cool","noisy"],"a":1,"e":"\"But at night it comes alive\" contrasts with how the desert looks at midday: lifeless."}]},{"id":"qr","name":"Quantitative Reasoning","minutes":35,"intro":"Questions 1–20 are word problems. Questions 21–37 are quantitative comparisons: compare the quantity in Column A with the quantity in Column B. No calculator is allowed. Use scratch paper.","questions":[{"t":"Word problems","q":"What is the value of 3 × (8 − 2) + 4?","c":["18","22","26","30"],"a":1,"e":"Parentheses first: 8 − 2 = 6. Then 3 × 6 = 18, and 18 + 4 = 22."},{"t":"Word problems","q":"A granola recipe uses 2 cups of nuts for every 3 cups of oats. How many cups of nuts are needed for 12 cups of oats?","c":["4","6","8","18"],"a":2,"e":"12 cups of oats is 4 times the recipe (12 ÷ 3 = 4), so use 4 × 2 = 8 cups of nuts."},{"t":"Word problems","q":"Which fraction is between <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> and <span class=\"fr\"><span>3<\/span><span>4<\/span><\/span>?","c":["<span class=\"fr\"><span>5<\/span><span>8<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>3<\/span><\/span>","<span class=\"fr\"><span>2<\/span><span>5<\/span><\/span>","<span class=\"fr\"><span>7<\/span><span>8<\/span><\/span>"],"a":0,"e":"In eighths, <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> = <span class=\"fr\"><span>4<\/span><span>8<\/span><\/span> and <span class=\"fr\"><span>3<\/span><span>4<\/span><\/span> = <span class=\"fr\"><span>6<\/span><span>8<\/span><\/span>. <span class=\"fr\"><span>5<\/span><span>8<\/span><\/span> is between them."},{"t":"Word problems","q":"Sam has 5 more than twice as many trading cards as Lee. If Lee has 12 cards, how many does Sam have?","c":["17","24","29","34"],"a":2,"e":"Twice 12 is 24, and 5 more is 29."},{"t":"Word problems","q":"If 20% of a number is 14, what is the number?","c":["2.8","28","56","70"],"a":3,"e":"20% is <span class=\"fr\"><span>1<\/span><span>5<\/span><\/span>, so the number is 5 × 14 = 70."},{"t":"Word problems","q":"The perimeter of a rectangle is 30 and its length is 9. What is its width?","c":["6","12","15","21"],"a":0,"e":"Length plus width is half the perimeter: 15. Then 15 − 9 = 6."},{"t":"Word problems","q":"In the pattern 3, 7, 11, 15, . . . each number is 4 more than the one before it. What is the 10th number in the pattern?","c":["36","39","40","43"],"a":1,"e":"The 10th number is the first number plus 9 steps of 4: 3 + 36 = 39."},{"t":"Word problems","q":"If n + 6 = 15, what is the value of 2n?","c":["9","18","21","42"],"a":1,"e":"n = 9, so 2n = 18."},{"t":"Word problems","q":"A bag contains 3 red, 5 blue, and 2 green marbles. If one marble is chosen at random, what is the probability that it is NOT blue?","c":["<span class=\"fr\"><span>1<\/span><span>5<\/span><\/span>","<span class=\"fr\"><span>3<\/span><span>10<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>","<span class=\"fr\"><span>7<\/span><span>10<\/span><\/span>"],"a":2,"e":"5 of the 10 marbles are not blue. <span class=\"fr\"><span>5<\/span><span>10<\/span><\/span> = <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>."},{"t":"Word problems","q":"Mia read 45 pages in 1.5 hours. At that rate, how many pages will she read in 4 hours?","c":["90","105","120","180"],"a":2,"e":"Her rate is 45 ÷ 1.5 = 30 pages per hour. 30 × 4 = 120."},{"t":"Word problems","q":"The sum of two numbers is 20, and their difference is 4. What is the larger number?","c":["12","14","16","24"],"a":0,"e":"The numbers are 12 and 8: 12 + 8 = 20 and 12 − 8 = 4."},{"t":"Word problems","q":"Which of the following is closest to 49 × 21?","c":["700","1,000","1,200","1,500"],"a":1,"e":"Round to 50 × 20 = 1,000. The exact product is 1,029."},{"t":"Word problems","q":"The area of a square is 64. What is the perimeter of the square?","c":["8","16","24","32"],"a":3,"e":"Each side is 8, because 8 × 8 = 64. The perimeter is 4 × 8 = 32."},{"t":"Word problems","q":"At dawn the temperature was −6°F. By noon it had risen 15 degrees. What was the temperature at noon?","c":["−21°F","−9°F","9°F","21°F"],"a":2,"e":"−6 + 15 = 9."},{"t":"Word problems","q":"Tickets to a play cost $8 for adults and $5 for children. What is the total cost for 3 adults and 4 children?","c":["$39","$44","$47","$52"],"a":1,"e":"3 × $8 = $24 and 4 × $5 = $20. Together that is $44."},{"t":"Word problems","q":"If 4 pencils cost $1.20, how much do 10 pencils cost at the same price each?","c":["$3.00","$3.20","$3.60","$4.80"],"a":0,"e":"Each pencil costs $1.20 ÷ 4 = $0.30. Ten pencils cost $3.00."},{"t":"Word problems","q":"The mean of 6, 9, 10, and x is 8. What is the value of x?","c":["4","5","6","7"],"a":3,"e":"Four numbers with a mean of 8 total 32. 6 + 9 + 10 = 25, so x = 7."},{"t":"Word problems","q":"A number is doubled, and then 7 is subtracted. The result is 15. What is the number?","c":["11","14","16","22"],"a":0,"e":"Work backward: 15 + 7 = 22, and 22 ÷ 2 = 11."},{"t":"Word problems","q":"How many whole numbers between 10 and 50 are multiples of both 2 and 3?","c":["6","7","8","13"],"a":1,"e":"Multiples of both 2 and 3 are multiples of 6: 12, 18, 24, 30, 36, 42, 48. That is 7 numbers."},{"t":"Word problems","q":"A wooden cube with edges 3 inches long is painted on all sides and then cut into 27 one-inch cubes. How many of the small cubes have paint on exactly two faces?","c":["6","8","10","12"],"a":3,"e":"The small cubes with exactly two painted faces sit in the middle of each edge of the large cube. A cube has 12 edges, so there are 12."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"<span class=\"fr\"><span>3<\/span><span>5<\/span><\/span>","B":"0.6","a":2,"e":"3 ÷ 5 = 0.6, so the two quantities are equal."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"2<sup>3<\/sup>","B":"3<sup>2<\/sup>","a":1,"e":"2<sup>3<\/sup> = 8 and 3<sup>2<\/sup> = 9."},{"t":"Quantitative comparisons","qc":true,"info":"x is a positive whole number.","A":"2x","B":"x + 2","a":3,"e":"If x = 1, Column A is 2 and Column B is 3. If x = 3, Column A is 6 and Column B is 5. The relationship cannot be determined."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"15% of 60","B":"10","a":1,"e":"10% of 60 is 6 and 5% is 3, so 15% of 60 is 9, which is less than 10."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"The perimeter of a square with sides of length 5","B":"The perimeter of an equilateral triangle with sides of length 6","a":0,"e":"The square's perimeter is 4 × 5 = 20. The triangle's is 3 × 6 = 18."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"−4 − (−7)","B":"2","a":0,"e":"Subtracting a negative is the same as adding: −4 + 7 = 3, which is greater than 2."},{"t":"Quantitative comparisons","qc":true,"info":"a = 3 and b = −2","A":"a × b","B":"a + b","a":1,"e":"a × b = −6 and a + b = 1."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"The number of days in 6 weeks","B":"The number of hours in 2 days","a":1,"e":"6 × 7 = 42 days. 2 × 24 = 48 hours."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> + <span class=\"fr\"><span>1<\/span><span>3<\/span><\/span>","B":"<span class=\"fr\"><span>5<\/span><span>6<\/span><\/span>","a":2,"e":"<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> + <span class=\"fr\"><span>1<\/span><span>3<\/span><\/span> = <span class=\"fr\"><span>3<\/span><span>6<\/span><\/span> + <span class=\"fr\"><span>2<\/span><span>6<\/span><\/span> = <span class=\"fr\"><span>5<\/span><span>6<\/span><\/span>."},{"t":"Quantitative comparisons","qc":true,"info":"The area of a rectangle is 24.","A":"The perimeter of the rectangle","B":"20","a":3,"e":"A 4-by-6 rectangle has perimeter 20. A 3-by-8 rectangle has perimeter 22. Both have area 24, so the relationship cannot be determined."},{"t":"Quantitative comparisons","qc":true,"info":"y &lt; 0","A":"y<sup>2<\/sup>","B":"y","a":0,"e":"The square of a negative number is positive, and y itself is negative."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"The mean of 2, 4, 6, and 8","B":"The median of 2, 4, 6, and 8","a":2,"e":"The mean is 20 ÷ 4 = 5. The median is halfway between 4 and 6, which is also 5."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"0.3 × 0.3","B":"0.9","a":1,"e":"0.3 × 0.3 = 0.09, which is much less than 0.9."},{"t":"Quantitative comparisons","qc":true,"info":"A shirt with a regular price of $20 is on sale for 25% off.","A":"The sale price of the shirt","B":"$15","a":2,"e":"25% of $20 is $5, so the sale price is $15."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"√81","B":"2<sup>3<\/sup>","a":0,"e":"√81 = 9 and 2<sup>3<\/sup> = 8."},{"t":"Quantitative comparisons","qc":true,"info":"2x = 10 and 3y = 12","A":"x","B":"y","a":0,"e":"x = 5 and y = 4."},{"t":"Quantitative comparisons","qc":true,"info":"A number cube with faces numbered 1 through 6 is rolled once.","A":"The probability of rolling an even number","B":"The probability of rolling a number greater than 4","a":0,"e":"Three faces are even (<span class=\"fr\"><span>3<\/span><span>6<\/span><\/span>). Only 5 and 6 are greater than 4 (<span class=\"fr\"><span>2<\/span><span>6<\/span><\/span>)."}]},{"id":"rc","name":"Reading Comprehension","minutes":35,"intro":"There are six passages, each followed by six questions. Answer each question based on what is stated or implied in the passage.","passages":[{"paras":["Every autumn, forests in the northern United States put on a show of yellow, orange, and red. Many people assume that cold weather paints the leaves, or that the colors appear from nowhere. In fact, some of those colors have been hiding inside the leaves all summer.","A leaf is green because of a substance called chlorophyll. Chlorophyll captures sunlight, and the tree uses that energy to make its food. During spring and summer a leaf produces so much chlorophyll that green covers every other color in it. As the days grow shorter in the fall, however, the tree gets a signal that winter is coming. It stops making chlorophyll, and the green slowly fades.","Once the green is gone, other colors can finally be seen. Yellow and orange come from substances called carotenoids, the same ones that give carrots and corn their color. They were in the leaf the whole time, masked by the green. Red and purple are different. They come from substances the leaf makes only in autumn, using sugar that becomes trapped in the leaf as the tree prepares for winter.","This explains why some autumns are more brilliant than others. Sunny fall days help leaves make plenty of sugar, and cool nights keep that sugar from leaving. A stretch of bright days and chilly, but not freezing, nights produces the deepest reds. A cloudy, rainy autumn produces mostly yellows and browns.","Finally, the tree lets go. A thin layer of cells grows across the base of each leaf stem and seals it off from the branch. The leaf dries, loosens, and falls. Dropping its leaves helps the tree survive the winter, because broad leaves lose a great deal of water, and water is hard to get when the ground is frozen."]},{"paras":["In 1860, a letter mailed in Missouri could take three weeks or more to reach California. It traveled by stagecoach over rough roads, or by ship around South America. For the thousands of people who had moved west during the Gold Rush, news from home was always old news.","In April of that year, a new service promised to cut the time to about ten days. It was called the Pony Express. The plan was simple and daring. A chain of stations was built along a route of nearly 1,900 miles, from St. Joseph, Missouri, to Sacramento, California. Stations stood ten to fifteen miles apart, about as far as a horse can gallop before it tires. A rider would race from one station to the next, leap onto a fresh horse that was saddled and waiting, and gallop on. After seventy-five miles or more, he handed the mail to a new rider.","The riders were mostly young and small, because a lighter rider meant a faster horse. They carried the mail in a leather cover with four locked pockets that fit over the saddle and could be moved from horse to horse in seconds. They rode day and night, through snow in the mountains and heat in the desert. Sending a letter this way was expensive, so writers used thin paper and small handwriting.","The Pony Express was a great success at delivering mail and a failure as a business. Hundreds of horses, dozens of riders, and nearly two hundred stations cost far more than the letters earned. Then, in October 1861, workers finished a telegraph line across the country. A message that took a rider ten days could now cross the continent in minutes. The Pony Express closed two days later.","It had lasted only about eighteen months. Yet people still remember it, perhaps because it stands for something they admire: a difficult job done at full speed by people who refused to be stopped."]},{"paras":["Mary Anning was born in 1799 in Lyme Regis, a small town on the southern coast of England. Her family was poor. To earn extra money, her father collected the strange stone shapes that washed out of the nearby cliffs and sold them to tourists as \"curiosities.\" He taught Mary and her brother Joseph how to find them. No one in the family knew that these were the remains of animals that had lived millions of years earlier.","When Mary was about twelve, Joseph found an enormous skull in the rocks, four feet long, with a pointed snout lined with sharp teeth. Mary searched for months until she found the rest of the skeleton. It belonged to a sea reptile that scientists later named ichthyosaur, which means \"fish lizard.\" Nothing so complete had ever been seen, and it caused a sensation.","Anning spent the rest of her life on those cliffs. The work was dangerous. The best time to search was after winter storms, when waves broke the cliffs apart and uncovered new fossils, but the same storms caused landslides. She went out anyway, and she made one remarkable find after another, including the first complete skeleton of a long-necked sea reptile called a plesiosaur.","She had almost no schooling, yet she taught herself to read scientific papers and studied the bodies of modern fish to understand the ancient ones. The leading scientists of England traveled to her little shop to buy fossils and to ask her opinion. They wrote about her discoveries in their books. They rarely mentioned her name. As a woman, she was not allowed to join the scientific society in London where her own finds were discussed.","Mary Anning died in 1847. Today her fossils are displayed in great museums, and she is recognized as one of the people who first showed the world that life on Earth has a very long history."]},{"paras":["\"I'm bored\" may be the two words that adults least like to hear. We rush to fix the problem. We hand over a screen, sign up for another activity, or suggest a list of chores. I would like to suggest something different. The next time you are bored, try doing nothing about it for a while.","Boredom is uncomfortable, and that is exactly why it is useful. It is the mind's way of saying that it wants something more interesting to do. If a video appears the instant that feeling arrives, the mind never has to answer its own question. But if nothing appears, something surprising happens. After a few restless minutes, you begin to invent. You build a fort out of couch cushions. You wonder how a lock works and take one apart. You start a story, or a drawing, or a ridiculous game with rules that only you understand.","Many inventors and writers have said that their best ideas arrived while they were doing something dull, such as walking, washing dishes, or staring out of a train window. That is no accident. A mind that is not being fed new information starts sorting through what it already has, and it makes connections it was too busy to notice before.","I am not saying that screens are bad or that every afternoon should be empty. Games and shows can be wonderful, and a schedule with nothing in it would be its own kind of problem. I am saying that an hour with nothing planned is not a disaster. It is an open door.","So the next time the afternoon stretches out in front of you with nothing in it, wait. Let yourself be bored for fifteen minutes. Then see what you come up with. It may turn out to be the best part of your day."]},{"paras":["A sea otter floating on its back, cracking a clam open on its chest, looks like an animal with nothing to do but enjoy itself. In truth, the otter is hard at work, and the health of an entire underwater forest depends on its appetite.","Unlike seals and whales, sea otters have no thick layer of fat to keep them warm in the cold Pacific. They rely on their fur, the densest of any animal, and on eating. An otter must eat about a quarter of its body weight every day just to stay warm. One of its favorite foods is the sea urchin, a spiny animal about the size of a tennis ball.","Sea urchins, in turn, eat kelp. Kelp is a giant seaweed that grows from the ocean floor toward the surface, sometimes more than a hundred feet tall. Where kelp grows thickly it forms a forest, and like a forest on land it shelters hundreds of other living things. Fish hide among its blades. Crabs and snails live on its stalks. Seabirds and seals come to hunt there.","When otters are present, they keep the number of urchins low, and the kelp grows tall. When otters disappear, the urchins multiply. They chew through the base of each kelp plant until the forest is gone. What remains is a bare, rocky sea floor covered with urchins and little else.","This is not just a theory. During the 1700s and 1800s, hunters killed nearly all the sea otters along the Pacific coast for their valuable fur. In many places the kelp forests vanished soon after. When otters were finally protected by law and slowly returned, the kelp came back with them, and so did the fish.","Scientists call an animal like the sea otter a keystone species. A keystone is the stone at the top of an arch that holds all the others in place. Take it away, and the arch falls."]},{"paras":["My hypothesis was that bean plants would grow taller if they listened to music. I was so sure of this that I had already painted the title on my poster in gold letters: MUSIC MAKES PLANTS GROW. All that remained was to grow the plants and collect my blue ribbon.","I planted twelve beans in twelve paper cups. Six lived on my windowsill beside a small speaker that played violin music for three hours every afternoon. The other six sat on the same windowsill at the far end, in silence. I watered them equally. I measured every plant every morning before school and wrote the numbers in a notebook.","For the first week, nothing I did seemed to matter to the beans at all. Then they sprouted, and by the third week I had a problem. The silent plants were taller. Not by much, about a centimeter on average, but they were taller, and my poster was already painted.","I thought about my choices. I could measure \"wrong.\" I could leave out the two tallest silent plants. Nobody would ever check. I held the notebook for a long time. Then I got a new sheet of poster board and painted a new title: DOES MUSIC MAKE PLANTS GROW? MINE DIDN'T.","At the science fair, my table stood between a model volcano and a robot that could pick up marshmallows. Nobody stopped at mine for almost an hour. Then one of the judges, a tall woman with a clipboard, read my poster from top to bottom. She asked why I thought the silent plants had done better. I admitted I didn't know. Maybe that end of the windowsill got more sun. Maybe twelve plants were not enough to tell.","She wrote something down. \"Those are exactly the right questions,\" she said. \"Most people only show me what worked.\"","I did not win the blue ribbon. The robot did. But I kept the notebook, and I still have it."]}],"questions":[{"t":"Main idea","q":"The main purpose of the passage is to","c":["explain why leaves change color and fall in autumn","describe the best places to see autumn leaves","argue that trees should be protected","compare trees that lose their leaves with trees that do not"],"a":0,"e":"Paragraphs 2 through 4 explain the color change, and paragraph 5 explains why leaves fall.","p":0},{"t":"Supporting detail","q":"According to the passage, a leaf looks green in summer because","c":["it has not yet made any other colors","warm weather turns leaves green","chlorophyll covers the other colors in the leaf","the leaf is full of sugar"],"a":2,"e":"Paragraph 2: a leaf makes \"so much chlorophyll that green covers every other color in it.\"","p":0},{"t":"Vocabulary in context","q":"In the third paragraph, the word \"masked\" most nearly means","c":["damaged","hidden","created","brightened"],"a":1,"e":"The yellow and orange were present \"the whole time\" but could not be seen under the green. They were hidden.","p":0},{"t":"Supporting detail","q":"According to the passage, how are red leaf colors different from yellow ones?","c":["Red colors are present all summer, and yellow ones are not.","Red colors come from chlorophyll.","Red colors appear only in rainy weather.","Red colors are made in the fall, and yellow ones are in the leaf all along."],"a":3,"e":"Paragraph 3 says the yellows \"were in the leaf the whole time,\" while reds come from substances \"the leaf makes only in autumn.\"","p":0},{"t":"Inference","q":"Based on the fourth paragraph, which autumn would most likely have the brightest red leaves?","c":["one with cloudy days and warm nights","one with sunny days and cool nights","one with rainy days and freezing nights","one with sunny days and freezing nights"],"a":1,"e":"The passage says \"bright days and chilly, but not freezing, nights\" produce the deepest reds.","p":0},{"t":"Supporting detail","q":"The passage states that losing its leaves helps a tree in winter by","c":["keeping its branches warm","giving it more sunlight","saving water","making room for new seeds"],"a":2,"e":"Paragraph 5: \"broad leaves lose a great deal of water, and water is hard to get when the ground is frozen.\"","p":0},{"t":"Main idea","q":"The passage is mainly about","c":["how the telegraph was invented","a fast mail service that lasted only a short time","what life was like during the Gold Rush","the dangers of traveling by stagecoach"],"a":1,"e":"The passage describes why the Pony Express began, how it worked, and why it ended after eighteen months.","p":1},{"t":"Supporting detail","q":"According to the passage, stations were placed ten to fifteen miles apart because","c":["that was about how far a horse could gallop before tiring","riders needed to stop for meals","towns were located that far apart","the law required it"],"a":0,"e":"Paragraph 2 says the distance was \"about as far as a horse can gallop before it tires.\"","p":1},{"t":"Inference","q":"The passage suggests that Pony Express riders were chosen partly for their","c":["knowledge of the telegraph","ability to write neatly","experience in business","light weight"],"a":3,"e":"Paragraph 3: riders were \"mostly young and small, because a lighter rider meant a faster horse.\"","p":1},{"t":"Vocabulary in context","q":"In the second paragraph, the word \"daring\" most nearly means","c":["careless","slow","bold","costly"],"a":2,"e":"Carrying mail 1,900 miles in ten days was a brave, ambitious plan. \"Bold\" is closest.","p":1},{"t":"Supporting detail","q":"The Pony Express closed mainly because","c":["too many riders quit","the weather made the route impossible","the telegraph could send messages much faster","people in California stopped writing letters"],"a":2,"e":"Paragraph 4: after the telegraph line was finished, a message could cross the country \"in minutes,\" and the service closed two days later.","p":1},{"t":"Organization","q":"The first paragraph is included mainly to","c":["show the problem that the Pony Express was meant to solve","explain how the Gold Rush began","describe the route of the Pony Express","introduce the riders"],"a":0,"e":"It describes how slow the mail was, which explains why a faster service was wanted.","p":1},{"t":"Main idea","q":"The passage is primarily about","c":["how fossils are formed in cliffs","the history of a small English town","a fossil hunter whose important discoveries were not fully credited in her lifetime","the differences between two ancient sea reptiles"],"a":2,"e":"The passage follows Anning's life and finds, and paragraphs 4 and 5 contrast how she was treated then with how she is seen now.","p":2},{"t":"Supporting detail","q":"According to the passage, the Anning family first collected fossils in order to","c":["study ancient animals","earn money","give them to museums","help scientists in London"],"a":1,"e":"Paragraph 1: \"To earn money,\" her father sold them to tourists.","p":2},{"t":"Supporting detail","q":"The passage says the best time to look for fossils was after winter storms because","c":["there were fewer tourists on the beach","the cold weather hardened the rocks","storms carried fossils in from the sea","waves broke the cliffs and uncovered new fossils"],"a":3,"e":"Paragraph 3: \"waves broke the cliffs apart and uncovered new fossils.\"","p":2},{"t":"Vocabulary in context","q":"In the second paragraph, the phrase \"caused a sensation\" most nearly means","c":["created great excitement","started an argument","produced a strange feeling","led to an accident"],"a":0,"e":"Nothing so complete had been seen before, so the discovery drew a great deal of excited attention.","p":2},{"t":"Inference","q":"The fact that leading scientists came to Anning's shop \"to ask her opinion\" suggests that they","c":["wanted to pay less for fossils","thought she needed more schooling","respected her knowledge","planned to invite her to join their society"],"a":2,"e":"Experts ask the opinion of someone whose knowledge they value. The passage says she was not allowed to join the society.","p":2},{"t":"Inference","q":"With which statement would the author most likely agree?","c":["Anning was lucky more than she was skilled.","Anning deserved more recognition than she received while she was alive.","Fossil hunting is too dangerous to be worthwhile.","Scientists in the 1800s knew little about fossils."],"a":1,"e":"The author notes that scientists \"rarely mentioned her name\" and ends by pointing out that she is recognized today.","p":2},{"t":"Main idea","q":"The author's main point is that","c":["screens are harmful to young people","adults should plan more activities for children","boredom should be avoided whenever possible","being bored can lead to creativity"],"a":3,"e":"Paragraphs 2 and 3 argue that boredom pushes the mind to invent and make connections.","p":3},{"t":"Supporting detail","q":"According to the second paragraph, boredom is useful because it","c":["pushes the mind to find something interesting to do","helps people fall asleep","teaches people to finish their chores","makes videos more enjoyable"],"a":0,"e":"The author says boredom is the mind \"saying that it wants something more interesting to do,\" and that with no quick fix, \"you begin to invent.\"","p":3},{"t":"Organization","q":"The author mentions inventors and writers in the third paragraph in order to","c":["prove that dull jobs are important","give examples that support the argument","suggest careers for the reader","show that famous people are often bored"],"a":1,"e":"Their experience is evidence for the claim that good ideas come when the mind is not busy.","p":3},{"t":"Figurative language","q":"When the author calls an unplanned hour \"an open door,\" the author means that it is","c":["a waste of time","a way to leave the house","an opportunity","a mistake"],"a":2,"e":"An open door invites you to go through and find something new. The author contrasts it with \"a disaster.\"","p":3},{"t":"Organization","q":"The fourth paragraph is included mainly to","c":["introduce a new argument against screens","tell a story about the author's childhood","explain how the brain works","make clear that the author is not against all screens or all planned activities"],"a":3,"e":"The author says, \"I am not saying that screens are bad or that every afternoon should be empty.\"","p":3},{"t":"Tone","q":"The tone of the passage is best described as","c":["friendly and encouraging","angry and impatient","sad and regretful","formal and scientific"],"a":0,"e":"The author speaks directly to the reader, makes gentle suggestions, and ends on a hopeful note.","p":3},{"t":"Main idea","q":"The main idea of the passage is that sea otters","c":["are the most playful animals in the ocean","were once hunted for their fur","play an important part in keeping kelp forests healthy","eat more than any other sea animal"],"a":2,"e":"Each paragraph builds toward the point that otters control urchins, which protects the kelp and everything living in it.","p":4},{"t":"Supporting detail","q":"According to the passage, sea otters must eat a great deal because","c":["they have no thick layer of fat to keep them warm","they are larger than seals","kelp is not very nutritious","they share their food with other animals"],"a":0,"e":"Paragraph 2: otters have no layer of fat and must eat about a quarter of their body weight each day \"just to stay warm.\"","p":4},{"t":"Inference","q":"If the sea otters left an area, which of the following would most likely happen first?","c":["The kelp would grow taller.","The number of sea urchins would increase.","Fish would become more plentiful.","Seals would begin eating kelp."],"a":1,"e":"Paragraph 4: \"When otters disappear, the urchins multiply.\" The loss of kelp and fish follows from that.","p":4},{"t":"Organization","q":"The author describes what happened in the 1700s and 1800s in order to","c":["explain why otter fur is valuable","criticize people who wear fur","show how otters learned to use tools","give real evidence for the connection between otters and kelp"],"a":3,"e":"The paragraph begins, \"This is not just a theory,\" and then gives a historical example.","p":4},{"t":"Vocabulary in context","q":"In the third paragraph, the word \"shelters\" most nearly means","c":["feeds","protects","traps","follows"],"a":1,"e":"The kelp gives animals a safe place to live and hide, as a forest does on land.","p":4},{"t":"Figurative language","q":"The author compares the sea otter to the keystone of an arch to show that the otter","c":["is stronger than other animals","lives at the top of the kelp forest","holds its community of living things together","is shaped like a stone"],"a":2,"e":"Just as the arch falls without its keystone, the kelp forest collapses without the otter.","p":4},{"t":"Main idea","q":"The passage is mainly about a student who","c":["discovers that music helps plants grow","loses a science fair because of a mistake","chooses to report results honestly even though they are disappointing","learns how to take care of bean plants"],"a":2,"e":"The turning point is paragraph 4, where the narrator decides to repaint the poster and tell the truth.","p":5},{"t":"Inference","q":"At the beginning of the passage, the narrator can best be described as","c":["overconfident","nervous","bored","careless"],"a":0,"e":"The narrator paints the conclusion on the poster before doing the experiment and expects to \"collect my blue ribbon.\"","p":5},{"t":"Supporting detail","q":"What was the \"problem\" the narrator had by the third week?","c":["The plants had not sprouted.","The speaker had stopped working.","The notebook was lost.","The results did not match the hypothesis."],"a":3,"e":"The silent plants were taller, the opposite of what the narrator had predicted and already painted on the poster.","p":5},{"t":"Inference","q":"The narrator \"held the notebook for a long time\" most likely because the narrator was","c":["trying to read the numbers","deciding whether to be honest about the results","waiting for the plants to grow","afraid of losing it"],"a":1,"e":"The sentences just before list ways to cheat, and the sentence after shows the decision to tell the truth.","p":5},{"t":"Inference","q":"The judge's comment suggests that she valued the narrator's","c":["artistic poster","choice of music","honesty and careful thinking","tall bean plants"],"a":2,"e":"She praises the narrator's questions and notes that \"most people only show me what worked.\"","p":5},{"t":"Inference","q":"The last sentence of the passage suggests that the narrator","c":["is proud of the experiment","plans to enter the science fair again","is still upset about losing","wishes the results had been different"],"a":0,"e":"Keeping the notebook for years shows that the work in it matters to the narrator more than the ribbon.","p":5}]},{"id":"ma","name":"Mathematics Achievement","minutes":40,"intro":"Each question has four answer choices. No calculator is allowed. Use scratch paper.","questions":[{"t":"Number sense","q":"What is the value of 6 + 4 × 5 − 2?","c":["18","24","28","48"],"a":1,"e":"Multiply first: 4 × 5 = 20. Then 6 + 20 − 2 = 24."},{"t":"Algebra","q":"If 3x − 4 = 17, what is the value of x?","c":["5","7","13","21"],"a":1,"e":"Add 4 to both sides: 3x = 21. Then x = 7."},{"t":"Data and probability","q":"What is the mode of the data set 4, 7, 7, 9, 12, 12, 12, 15?","c":["7","9","12","15"],"a":2,"e":"The mode is the value that appears most often. 12 appears three times."},{"t":"Geometry","q":"A triangle has angles that measure 90° and 35°. What is the measure of the third angle?","c":["45°","55°","65°","125°"],"a":1,"e":"The angles of a triangle add to 180°. 180 − 90 − 35 = 55."},{"t":"Number sense","q":"What is 2.4 × 0.5?","c":["0.12","1.2","2.9","12"],"a":1,"e":"Multiplying by 0.5 is the same as taking half. Half of 2.4 is 1.2."},{"t":"Measurement","q":"How many meters are in 2.5 kilometers?","c":["25","250","2,500","25,000"],"a":2,"e":"One kilometer is 1,000 meters. 2.5 × 1,000 = 2,500."},{"t":"Algebra","q":"Which expression is equivalent to 4x + 7 − x + 2?","c":["3x + 9","5x + 9","3x + 5","12x"],"a":0,"e":"Combine like terms: 4x − x = 3x and 7 + 2 = 9."},{"t":"Data and probability","q":"What is the mean of 12, 15, 18, and 19?","c":["15","16","16.5","18"],"a":1,"e":"The total is 64, and 64 ÷ 4 = 16."},{"t":"Number sense","q":"What is <span class=\"fr\"><span>3<\/span><span>8<\/span><\/span> + <span class=\"fr\"><span>1<\/span><span>4<\/span><\/span>?","c":["<span class=\"fr\"><span>4<\/span><span>12<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>","<span class=\"fr\"><span>5<\/span><span>8<\/span><\/span>","<span class=\"fr\"><span>7<\/span><span>8<\/span><\/span>"],"a":2,"e":"<span class=\"fr\"><span>1<\/span><span>4<\/span><\/span> = <span class=\"fr\"><span>2<\/span><span>8<\/span><\/span>, so the sum is <span class=\"fr\"><span>5<\/span><span>8<\/span><\/span>. Adding the tops and the bottoms gives the trap answer <span class=\"fr\"><span>4<\/span><span>12<\/span><\/span>."},{"t":"Geometry","q":"How many lines of symmetry does a square have?","c":["1","2","4","8"],"a":2,"e":"A square can be folded onto itself along a vertical line, a horizontal line, and both diagonals."},{"t":"Algebra","q":"If y = 2x + 1, what is the value of y when x = 5?","c":["8","10","11","13"],"a":2,"e":"2(5) + 1 = 11."},{"t":"Measurement","q":"What is the area of a triangle with a base of 10 and a height of 6?","c":["16","30","32","60"],"a":1,"e":"Area = <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> × base × height = <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> × 10 × 6 = 30."},{"t":"Data and probability","q":"In a survey of 50 students, 30% chose soccer as their favorite sport. How many students chose soccer?","c":["15","20","30","35"],"a":0,"e":"10% of 50 is 5, so 30% is 15."},{"t":"Number sense","q":"What is the value of −9 + 14 − 8?","c":["−31","−13","−3","3"],"a":2,"e":"−9 + 14 = 5, and 5 − 8 = −3."},{"t":"Algebra","q":"Which expression means \"5 less than twice a number n\"?","c":["5 − 2n","2n − 5","2(n − 5)","n − 10"],"a":1,"e":"Twice the number is 2n. Five less than that is 2n − 5."},{"t":"Geometry","q":"In which quadrant of the coordinate plane is the point (−3, 2) located?","c":["Quadrant I","Quadrant II","Quadrant III","Quadrant IV"],"a":1,"e":"A negative x-coordinate and a positive y-coordinate place the point in the upper left, Quadrant II."},{"t":"Data and probability","q":"What is the range of the data set 14, 9, 22, 17, 11?","c":["13","14","17","22"],"a":0,"e":"Range = greatest − least = 22 − 9 = 13."},{"t":"Measurement","q":"How many inches are in 3 feet 4 inches?","c":["40","43","48","64"],"a":0,"e":"3 feet = 36 inches. 36 + 4 = 40."},{"t":"Number sense","q":"What is the greatest common factor of 36 and 48?","c":["4","6","12","24"],"a":2,"e":"12 divides both numbers (36 = 12 × 3, 48 = 12 × 4), and no larger number does."},{"t":"Algebra","q":"If <span class=\"fr\"><span>x<\/span><span>3<\/span><\/span> = 12, what is the value of x?","c":["4","9","15","36"],"a":3,"e":"Multiply both sides by 3: x = 36."},{"t":"Data and probability","q":"A fair coin is flipped twice. What is the probability that it lands heads both times?","c":["<span class=\"fr\"><span>1<\/span><span>4<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>3<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>","<span class=\"fr\"><span>3<\/span><span>4<\/span><\/span>"],"a":0,"e":"There are four equally likely outcomes: HH, HT, TH, TT. One of them is two heads, so the probability is <span class=\"fr\"><span>1<\/span><span>4<\/span><\/span>."},{"t":"Measurement","q":"What is the volume of a box that is 3 inches wide, 4 inches long, and 5 inches tall?","c":["12 cubic inches","47 cubic inches","60 cubic inches","94 cubic inches"],"a":2,"e":"3 × 4 × 5 = 60."},{"t":"Number sense","q":"What is the value of 5<sup>3<\/sup>?","c":["15","125","243","625"],"a":1,"e":"5 × 5 × 5 = 125. Multiplying 5 × 3 gives the trap answer 15."},{"t":"Algebra","q":"If 2(x + 3) = 20, what is the value of x?","c":["7","8.5","10","13"],"a":0,"e":"Divide both sides by 2: x + 3 = 10, so x = 7."},{"t":"Geometry","q":"Two angles are supplementary. If one angle measures 65°, what is the measure of the other?","c":["25°","35°","115°","125°"],"a":2,"e":"Supplementary angles add to 180°. 180 − 65 = 115. (25° would be the complement.)"},{"t":"Data and probability","q":"What is the median of the data set 5, 12, 8, 20, 9?","c":["8","9","10.8","12"],"a":1,"e":"In order: 5, 8, 9, 12, 20. The middle value is 9. (10.8 is the mean.)"},{"t":"Number sense","q":"What is 4,682.47 rounded to the nearest hundred?","c":["4,600","4,680","4,700","5,000"],"a":2,"e":"The tens digit is 8, so round the hundreds digit up: 4,700."},{"t":"Measurement","q":"A movie starts at 6:45 p.m. and lasts 1 hour 50 minutes. At what time does it end?","c":["8:35 p.m.","8:45 p.m.","8:55 p.m.","9:35 p.m."],"a":0,"e":"One hour later is 7:45. Fifty minutes after that is 8:35."},{"t":"Algebra","q":"What is the value of 2a + 3b when a = 4 and b = −2?","c":["2","6","14","20"],"a":0,"e":"2(4) + 3(−2) = 8 − 6 = 2."},{"t":"Data and probability","q":"The table shows the number of pages Ana read on four days.<table class=\"dt\"><tr><th>Day<\/th><th>Pages read<\/th><\/tr><tr><td>Monday<\/td><td>12<\/td><\/tr><tr><td>Tuesday<\/td><td>18<\/td><\/tr><tr><td>Wednesday<\/td><td>9<\/td><\/tr><tr><td>Thursday<\/td><td>21<\/td><\/tr><\/table>How many more pages did Ana read on Thursday than on the day she read the fewest pages?","c":["3","9","12","21"],"a":2,"e":"She read the fewest pages on Wednesday (9). 21 − 9 = 12."},{"t":"Number sense","q":"Which fraction is equal to 0.375?","c":["<span class=\"fr\"><span>3<\/span><span>8<\/span><\/span>","<span class=\"fr\"><span>3<\/span><span>5<\/span><\/span>","<span class=\"fr\"><span>37<\/span><span>50<\/span><\/span>","<span class=\"fr\"><span>5<\/span><span>8<\/span><\/span>"],"a":0,"e":"3 ÷ 8 = 0.375."},{"t":"Geometry","q":"Which of the following shapes always has four sides of equal length?","c":["rhombus","rectangle","trapezoid","parallelogram"],"a":0,"e":"A rhombus is defined as a quadrilateral with four equal sides."},{"t":"Algebra","q":"Which of the following shows all the solutions of x + 4 &lt; 9?","c":["x &gt; 13","x &lt; 13","x &gt; 5","x &lt; 5"],"a":3,"e":"Subtract 4 from both sides: x &lt; 5."},{"t":"Measurement","q":"What is the circumference of a circle with a radius of 5?","c":["5π","10π","25π","100π"],"a":1,"e":"Circumference = 2πr = 10π. The area would be 25π."},{"t":"Data and probability","q":"Leo has 3 different shirts and 4 different pairs of pants. How many different outfits of one shirt and one pair of pants can he make?","c":["7","12","16","64"],"a":1,"e":"Each of the 3 shirts can go with any of the 4 pairs of pants: 3 × 4 = 12."},{"t":"Number sense","q":"Which of the following is a prime number?","c":["49","51","57","59"],"a":3,"e":"49 = 7 × 7, 51 = 3 × 17, and 57 = 3 × 19. Only 59 has no factors other than 1 and itself."},{"t":"Algebra","q":"If <span class=\"fr\"><span>3<\/span><span>n<\/span><\/span> = <span class=\"fr\"><span>12<\/span><span>20<\/span><\/span>, what is the value of n?","c":["4","5","6","8"],"a":1,"e":"<span class=\"fr\"><span>12<\/span><span>20<\/span><\/span> simplifies to <span class=\"fr\"><span>3<\/span><span>5<\/span><\/span>, so n = 5."},{"t":"Data and probability","q":"A spinner is divided into 5 equal sections labeled A, B, C, D, and E. If the spinner is spun 100 times, about how many times would it be expected to land on C?","c":["5","20","25","50"],"a":1,"e":"The chance of C on each spin is <span class=\"fr\"><span>1<\/span><span>5<\/span><\/span>, and <span class=\"fr\"><span>1<\/span><span>5<\/span><\/span> of 100 is 20."},{"t":"Measurement","q":"What is the area of a rectangle that is 7.5 feet long and 4 feet wide?","c":["11.5 square feet","23 square feet","28 square feet","30 square feet"],"a":3,"e":"7.5 × 4 = 30. The perimeter, 23, is a trap answer."},{"t":"Geometry","q":"The point (2, 5) is moved 4 units to the left and 3 units down. What are its new coordinates?","c":["(6, 8)","(6, 2)","(−2, 8)","(−2, 2)"],"a":3,"e":"Left 4 changes x from 2 to −2. Down 3 changes y from 5 to 2."},{"t":"Algebra","q":"Jordan has $50 and saves $15 each week. After how many weeks will Jordan have $170?","c":["6","8","10","12"],"a":1,"e":"Jordan needs 170 − 50 = 120 more dollars. 120 ÷ 15 = 8 weeks."},{"t":"Data and probability","q":"A bag contains 4 red marbles and 6 blue marbles. If one marble is chosen at random, what is the probability that it is red?","c":["25%","33%","40%","60%"],"a":2,"e":"4 of the 10 marbles are red. <span class=\"fr\"><span>4<\/span><span>10<\/span><\/span> = 40%."},{"t":"Number sense","q":"What is 3<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> ÷ <span class=\"fr\"><span>1<\/span><span>4<\/span><\/span>?","c":["<span class=\"fr\"><span>7<\/span><span>8<\/span><\/span>","7","12","14"],"a":3,"e":"3<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> = <span class=\"fr\"><span>7<\/span><span>2<\/span><\/span>. Dividing by <span class=\"fr\"><span>1<\/span><span>4<\/span><\/span> is the same as multiplying by 4: <span class=\"fr\"><span>7<\/span><span>2<\/span><\/span> × 4 = 14."},{"t":"Algebra","q":"The table shows values of x and y.<table class=\"dt\"><tr><th>x<\/th><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><th>y<\/th><td>4<\/td><td>7<\/td><td>10<\/td><td>13<\/td><\/tr><\/table>Which rule describes the relationship between x and y?","c":["y = x + 3","y = 4x","y = 3x + 1","y = 2x + 2"],"a":2,"e":"y goes up by 3 each time x goes up by 1, and when x = 1, y = 4. That fits y = 3x + 1. The other rules work for x = 1 but fail for x = 2."},{"t":"Measurement","q":"On a map, 1 centimeter represents 25 kilometers. Two cities are 6.5 centimeters apart on the map. What is the actual distance between them?","c":["31.5 km","150 km","156 km","162.5 km"],"a":3,"e":"6.5 × 25 = 150 + 12.5 = 162.5."},{"t":"Data and probability","q":"The table shows the number of pages Ana read on four days.<table class=\"dt\"><tr><th>Day<\/th><th>Pages read<\/th><\/tr><tr><td>Monday<\/td><td>12<\/td><\/tr><tr><td>Tuesday<\/td><td>18<\/td><\/tr><tr><td>Wednesday<\/td><td>9<\/td><\/tr><tr><td>Thursday<\/td><td>21<\/td><\/tr><\/table>What fraction of the total pages did Ana read on Tuesday?","c":["<span class=\"fr\"><span>1<\/span><span>6<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>5<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>4<\/span><\/span>","<span class=\"fr\"><span>3<\/span><span>10<\/span><\/span>"],"a":3,"e":"The total is 12 + 18 + 9 + 21 = 60 pages. <span class=\"fr\"><span>18<\/span><span>60<\/span><\/span> = <span class=\"fr\"><span>3<\/span><span>10<\/span><\/span>."},{"t":"Data and probability","q":"Tara scored 80, 85, and 90 on her first three tests. What score does she need on the fourth test to have a mean of 87 for all four?","c":["89","91","92","93"],"a":3,"e":"Four tests with a mean of 87 total 348. Her first three total 255. 348 − 255 = 93."}]},{"id":"essay","name":"Essay","minutes":30,"intro":"You will be given one prompt. Plan and write an essay in response. The essay is not scored, but a copy is sent to every school that receives your scores.","prompt":"If you could spend a day with any person, living or from history, who would it be? Explain why you chose this person and what you would want to do or talk about together.","note":"On the real test you write by hand on two lined pages, or type if you test online. Aim for four or five paragraphs."}]}};
const LV = Object.keys(TESTS);

const MODES = { timed: { label: 'Standard time', note: 'Real test timing for each section.', mult: 1 }, extended: { label: 'Time and a half', note: 'For students approved for 50% extended time.', mult: 1.5 }, untimed: { label: 'Untimed', note: 'No clock. Good for a first look at the question types.', mult: 0 } };

function freshLevel(lv) { const s = {}; TESTS[lv].sections.forEach(x => { s[x.id] = x.questions ? { status: 'new', rem: 0, timed: true, qi: 0, ans: x.questions.map(() => null), flag: {} } : { status: 'new', rem: 0, timed: true, text: '' }; }); return { mode: 'timed', s }; }
function fresh() { const o = { level: LV[0], view: 'home', si: 0, notice: '', L: {} }; LV.forEach(lv => { o.L[lv] = freshLevel(lv); }); return o; }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.L && LV.every(lv => s.L[lv] && TESTS[lv].sections.every(x => { const r = s.L[lv].s[x.id]; return r && (!x.questions || (r.ans && r.ans.length === x.questions.length)); }))) return s;
  } catch (e) {}
  return null;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s % 60; return m + ':' + String(r).padStart(2, '0'); };
const T = () => TESTS[st.level];
const SECS = () => T().sections;
const P = () => st.L[st.level];
const sec = () => SECS()[st.si];

function stem(q) {
  if (q.syn) return `<p class="syn">${q.q}</p>`;

  return `<div class="qtext">${q.q}</div>`;
}
function passageHTML(s, p) { return s.passages[p].paras.map((t, i) => `<p><span class="pn">${i + 1}</span><span>${t}</span></p>`).join(''); }
function score(s) {
  const a = P().s[s.id].ans; let right = 0; const topics = {};
  s.questions.forEach((q, i) => { const t = topics[q.t] || (topics[q.t] = { right: 0, total: 0 }); t.total++; if (a[i] === q.a) { right++; t.right++; } });
  return { right, total: s.questions.length, topics };
}

  const anyDone = SECS().some(s => p.s[s.id].status === 'done');

  const rows = SECS().map((s, i) => {

      <div class="row"><button class="btn" data-act="results" ${anyDone ? '' : 'disabled'}>See results</button><a href="#${st.level}-paper" class="small">View all questions on one page</a>${anyTouched ? `<button class="btn" data-act="reset" style="margin-left:auto">Erase this test</button>` : ''}</div></section>

      <ul class="small" style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px">

/* ---------- section intro ---------- */
function intro() {
  const s = sec(), isEssay = !s.questions, mode = P().mode;
  const time = mode === 'untimed' ? 'Untimed' : Math.round(s.minutes * MODES[mode].mult) + ' minutes';
  app.innerHTML = `<div class="wrap"><section class="sheet stack">
    <span class="eyebrow">${T().label} · section ${st.si + 1} of ${SECS().length}</span><h1>${s.name}</h1>
    <p><strong>${isEssay ? '1 prompt' : s.questions.length + ' questions'}</strong> · <strong>${time}</strong></p>
    <p>${s.intro}</p>
    <div class="row"><button class="btn primary" data-act="start-section">Start section</button><button class="btn" data-act="home">Back to sections</button></div>
    <p class="small muted">The clock starts when you press Start. It pauses if you go back to the section list.</p></section></div>`;
}

/* ---------- test section ---------- */
let shownPassage = -1;
function barHTML(s, mid, endLabel) {
  return `<div class="bar"><div class="bar-in"><span class="name">${s.name} <span class="small muted" style="font-family:var(--ui);font-weight:400">· ${T().label}</span></span><span id="${mid}" class="small muted"></span>
    <span class="row"><span id="clock" class="clock"></span><button class="btn" data-act="leave" title="Pause this section and go back to the section list">Pause and switch</button><button class="btn" data-act="ask-end">${endLabel}</button></span></div></div>`;
}
function sectionShell() {
  const s = sec(), split = !!s.passages;
  shownPassage = -1;
  app.innerHTML = barHTML(s, 'count', 'End section') + `<div class="test ${split ? 'split' : ''}">
      ${split ? `<div class="split-grid"><div class="sheet passage" id="passage" tabindex="0" aria-label="Passage"></div><div id="qpane" class="stack"></div></div>` : `<div id="qpane" class="stack"></div>`}
      <div class="sheet stack"><div class="navgrid" id="nav"></div>
      <div class="legend"><span><i class="l1"></i>Answered</span><span><i></i>Not answered</span><span><i class="l2"></i>Flagged</span></div></div>
    </div><div id="dlg"></div>`;
  question(); clock();
}
function question() {
  const s = sec(), r = rec(), q = s.questions[r.qi], a = r.ans[r.qi], fl = r.flag[r.qi];
  if (s.passages && q.p !== shownPassage) { const el = document.getElementById('passage'); el.innerHTML = passageHTML(s, q.p); el.scrollTop = 0; shownPassage = q.p; }
  document.getElementById('count').textContent = `Question ${r.qi + 1} of ${s.questions.length}`;
  const pnote = s.passages ? `<span class="eyebrow">Passage ${q.p + 1} of ${s.passages.length}</span>` : '';
  document.getElementById('qpane').innerHTML = `<div class="sheet stack">${pnote}<h3>Question ${r.qi + 1}</h3>${stem(q)}
    <ul class="choices">${choicesOf(q).map((c, i) => `<li><button class="choice ${a === i ? 'on' : ''}" data-act="pick" data-i="${i}" aria-pressed="${a === i}"><span class="oval">${L[i]}</span><span>${c}</span></button></li>`).join('')}</ul></div>
    <div class="row spread"><button class="btn" data-act="prev" ${r.qi === 0 ? 'disabled' : ''}>Previous</button>
    <button class="btn ${fl ? 'flagged' : ''}" data-act="flag" aria-pressed="${!!fl}">${fl ? 'Flagged' : 'Flag for review'}</button>
    ${r.qi === s.questions.length - 1 ? `<button class="btn primary" data-act="ask-end">Finish section</button>` : `<button class="btn primary" data-act="next">Next</button>`}</div>`;
  document.getElementById('nav').innerHTML = s.questions.map((_, i) => `<button class="nb ${r.ans[i] !== null ? 'done' : ''} ${r.flag[i] ? 'fl' : ''} ${i === r.qi ? 'cur' : ''}" data-act="goto" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join('');
}
function clock() {
  const el = document.getElementById('clock'); if (!el) return;
  const r = rec();
  if (!r.timed) { el.textContent = 'Untimed'; return; }
  el.textContent = fmt(r.rem); el.classList.toggle('warn', r.rem <= 300);
}
function stopTimer() { clearInterval(tick); tick = null; }
function runTimer() {
  stopTimer();
  if (!rec().timed) return;
  tick = setInterval(() => { const r = rec(); r.rem--; clock(); if (r.rem % 5 === 0) save(); if (r.rem <= 0) endSection(true); }, 1000);
}
function keepEssay() { const ta = document.getElementById('essay'); if (ta) rec().text = ta.value; }
function leave() { stopTimer(); keepEssay(); st.view = 'home'; save(); render(); toTop(); }
function askEnd() {
  const s = sec(), r = rec(); let msg;
  if (s.questions) { const left = r.ans.filter(x => x === null).length; msg = left ? `You have <strong>${left} unanswered question${left === 1 ? '' : 's'}</strong>. There is no penalty for guessing, so it is worth filling them in.` : 'You have answered every question.'; }
  else msg = 'Your essay will be saved for you to review.';
  const timeLeft = r.timed && r.rem > 0 ? ` You still have ${fmt(r.rem)} left.` : '';
  document.getElementById('dlg').innerHTML = `<div class="overlay"><div class="dialog stack" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h2 id="dlg-t">End this section?</h2><p>${msg}${timeLeft}</p><p class="small muted">Ending locks your answers and scores the section. To take a break and come back, use Pause and switch.</p><div class="row"><button class="btn" data-act="close-dlg">Keep working</button><button class="btn primary" data-act="end">End and score</button></div></div></div>`;
}
function endSection(timeUp) {
  stopTimer(); keepEssay();
  const s = sec(); rec().status = 'done';
  const allDone = SECS().every(x => P().s[x.id].status === 'done');
  st.notice = (timeUp === true ? `Time is up for ${s.name}. ` : `${s.name} is finished. `) + (allDone ? 'All five sections are done.' : 'Pick your next section below, or see your results so far.');
  st.view = allDone ? 'results' : 'home';
  if (allDone) st.notice = '';
  save(); render(); toTop();
}

/* ---------- essay ---------- */
function essay() {
  const s = sec();
  app.innerHTML = barHTML(s, 'wc', 'Finish essay') + `<div class="test"><div class="sheet stack"><span class="eyebrow">Prompt</span><p class="qtext">${s.prompt}</p>
    <p class="small muted">${s.note}</p></div>
    <label for="essay" class="eyebrow">Your essay</label><textarea id="essay" spellcheck="false" placeholder="Take a few minutes to plan, then write.">${esc(rec().text)}</textarea></div><div id="dlg"></div>`;
  clock(); wc();
}
function wc() { const ta = document.getElementById('essay'); if (!ta) return; const n = (ta.value.trim().match(/\S+/g) || []).length; document.getElementById('wc').textContent = n + (n === 1 ? ' word' : ' words'); }

/* ---------- results ---------- */
function reviewItem(s, i) {
  const q = s.questions[i], a = P().s[s.id].ans[i];
  const status = a === null ? `<span class="pill">Not answered</span>` : a === q.a ? `<span class="pill ok">Correct</span>` : `<span class="pill low">Incorrect</span>`;
  const ch = choicesOf(q).map((c, k) => { const cls = k === q.a ? 'right' : (k === a ? 'wrong' : ''); const tag = k === q.a ? (k === a ? 'Your answer · correct' : 'Correct answer') : (k === a ? 'Your answer' : ''); return `<li><div class="choice ${cls}"><span class="oval">${L[k]}</span><span>${c}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</div></li>`; }).join('');
  const pass = s.passages ? `<details><summary>Show passage ${q.p + 1}</summary><div class="passage" style="margin-top:10px;max-height:none">${passageHTML(s, q.p)}</div></details>` : '';
  return `<div class="item"><div class="row spread"><h3>Question ${i + 1} <span class="small muted" style="font-family:var(--ui);font-weight:400">· ${q.t}</span></h3>${status}</div>${pass}${stem(q)}<ul class="choices">${ch}</ul><p class="why">${q.e}</p></div>`;
}
function results() {
  const p = P(), all = SECS().filter(s => s.questions), done = all.filter(s => p.s[s.id].status === 'done');
  const es = SECS()[SECS().length - 1], er = p.s[es.id];
  const head = `<header class="stack"><span class="eyebrow">${T().label} Practice Test 1 · results</span><h1>Your scores</h1></header>`;
  const back = `<div class="row"><button class="btn primary" data-act="home">Back to sections</button></div>`;
  const sc = {}; done.forEach(s => { sc[s.id] = score(s); });
  const rows = all.map(s => { if (!sc[s.id]) return `<tr><td>${s.name}</td><td class="num muted" colspan="3">${p.s[s.id].status === 'open' ? 'In progress' : 'Not started'}</td></tr>`; const v = sc[s.id], pc = Math.round(100 * v.right / v.total); return `<tr><td>${s.name}</td><td class="num">${v.right} / ${v.total}</td><td class="num">${pc}%</td><td><div class="meter"><span style="width:${pc}%"></span></div></td></tr>`; }).join('');
  const weak = [];
  const topicRows = done.map(s => Object.entries(sc[s.id].topics).map(([t, v]) => { const pc = Math.round(100 * v.right / v.total); if (pc < 60) weak.push(`${t} (${s.name})`); return `<tr><td>${s.name}</td><td>${t}</td><td class="num">${v.right} / ${v.total}</td><td><span class="pill ${pc < 60 ? 'low' : pc >= 80 ? 'ok' : ''}">${pc}%</span></td></tr>`; }).join('')).join('');
  let review = '';
  if (done.length) {
    if (reviewTab >= done.length) reviewTab = 0;
    const s = done[reviewTab]; let idx = s.questions.map((_, i) => i);
    if (missedOnly) idx = idx.filter(i => p.s[s.id].ans[i] !== s.questions[i].a);
    const items = idx.length ? idx.map(i => reviewItem(s, i)).join('') : `<p class="muted">Nothing missed in this section.</p>`;
    review = `<section class="sheet stack"><h2>By topic</h2>${weak.length ? `<p>Study first: <strong>${weak.join(', ')}</strong>.</p>` : `<p>No topic fell below 60%.</p>`}
      <div class="scroll-x"><table><thead><tr><th>Section</th><th>Topic</th><th class="num">Correct</th><th>Percent</th></tr></thead><tbody>${topicRows}</tbody></table></div></section>
      <section class="sheet stack"><h2>Review every question</h2>
      <div class="row spread"><div class="tabs">${done.map((x, i) => `<button class="tab ${i === reviewTab ? 'on' : ''}" data-act="tab" data-i="${i}">${x.name}</button>`).join('')}</div>
      <label for="missed" class="small row" style="gap:6px"><input type="checkbox" id="missed" ${missedOnly ? 'checked' : ''}> Missed or skipped only</label></div>
      <div class="stack" style="gap:18px">${items}</div></section>`;
  }
  const essayBlock = er.status === 'done' ? `<section class="sheet stack"><h2>Your essay</h2><p class="small muted">The essay is not scored. A copy is sent to each school you apply to. Prompt: ${es.prompt}</p>
      ${er.text.trim() ? `<div class="essay-out">${esc(er.text)}</div><div class="row"><button class="btn" data-act="copy-essay">Copy essay</button><span id="copied" class="small muted"></span></div>` : `<p class="muted">No essay was written.</p>`}
      <div class="stack small"><strong>Read it back and ask:</strong><ul style="margin:0;padding-left:1.2em"><li>Does the first paragraph answer the prompt directly?</li><li>Does each paragraph have one clear point with a specific example from your own life?</li><li>Is there a short conclusion that says what you learned or why it matters?</li><li>Did you leave two minutes to fix spelling and punctuation?</li></ul></div></section>` : '';
  app.innerHTML = `<div class="wrap">${head}${back}
    <section class="sheet stack"><div class="scroll-x"><table><thead><tr><th>Section</th><th class="num">Correct</th><th class="num">Percent</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small muted">These are raw scores. The real ISEE converts each raw score to a scaled score (760–940), a percentile and a stanine (1–9) by comparing you with other applicants to the same grade over the past three years. That comparison data belongs to ERB, so a practice test cannot give you a true stanine. Use these scores to see which sections and topics need the most work.</p></section>
    ${review}${essayBlock}${back}<div id="dlg"></div></div>`;
}

/* ---------- one-page view ---------- */
function paper(lv) {
  const t = TESTS[lv];
  let out = `<div class="wrap"><header class="stack"><span class="eyebrow">All questions on one page</span><h1>ISEE ${t.label} Practice Test 1</h1><p class="noprint"><a href="#">Back to the timed test</a></p></header>`;
  t.sections.forEach((s, si) => {
    out += `<section class="sheet stack"><span class="eyebrow">Section ${si + 1} · ${s.minutes} minutes</span><h2>${s.name}</h2><p class="small muted">${s.intro}</p>`;
    if (!s.questions) { out += `<p class="qtext">${s.prompt}</p><p class="small muted">${s.note}</p></section>`; return; }
    let lastP = -1;
    s.questions.forEach((q, i) => {
      if (s.passages && q.p !== lastP) { out += `<div class="item stack"><span class="eyebrow">Passage ${q.p + 1}</span><div class="passage" style="max-height:none">${passageHTML(s, q.p)}</div></div>`; lastP = q.p; }
      out += `<div class="item"><h3>${i + 1}.</h3>${stem(q)}<ul class="choices">${choicesOf(q).map((c, k) => `<li><div class="choice"><span class="oval">${L[k]}</span><span>${c}</span></div></li>`).join('')}</ul></div>`;
    });
    out += `</section>`;
  });
  out += `<section class="sheet stack"><h2>Answer key</h2>`;
  t.sections.filter(s => s.questions).forEach(s => { out += `<h3>${s.name}</h3><div class="key">${s.questions.map((q, i) => `<div>${i + 1}. ${L[q.a]}</div>`).join('')}</div>`; });
  out += `</section></div>`;
  app.innerHTML = out;
}

/* ---------- routing and events ---------- */
function paperLevel() { const m = location.hash.match(/^#([a-z]+)-paper$/); return m && TESTS[m[1]] ? m[1] : null; }
function render() {
  const pl = paperLevel();
  if (pl) { paper(pl); return; }
  if (st.view === 'home') home();
  else if (st.view === 'intro') intro();
  else if (st.view === 'section') { sectionShell(); if (!tick) runTimer(); }
  else if (st.view === 'essay') { essay(); if (!tick) runTimer(); }
  else if (st.view === 'results') results();
}
function dialog(title, body, act, label) {
  document.getElementById('dlg').innerHTML = `<div class="overlay"><div class="dialog stack" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h2 id="dlg-t">${title}</h2><p>${body}</p><div class="row"><button class="btn" data-act="close-dlg">Cancel</button><button class="btn primary" data-act="${act}">${label}</button></div></div></div>`;
}
function enter(i) {
  st.si = i; const s = sec(), r = rec();
  if (r.status === 'new') st.view = 'intro';
  else st.view = s.questions ? 'section' : 'essay';
  save(); render(); toTop();
}
let pendingRedo = -1;
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  switch (act) {
    case 'level': st.level = b.dataset.lv; reviewTab = 0; save(); render(); break;
    case 'open': enter(i); break;
    case 'redo': pendingRedo = i; dialog('Retake this section?', `This erases your answers and score for ${SECS()[i].name} so you can take it again.`, 'do-redo', 'Erase and retake'); break;
    case 'do-redo': { const fr = freshLevel(st.level).s[SECS()[pendingRedo].id]; P().s[SECS()[pendingRedo].id] = fr; enter(pendingRedo); break; }
    case 'results': st.view = 'results'; render(); toTop(); break;
    case 'home': st.view = 'home'; render(); toTop(); break;
    case 'reset': dialog('Erase this test?', `This erases every answer and the essay for the ${T().label} test saved in this browser. The other level is not affected.`, 'do-reset', 'Erase'); break;
    case 'do-reset': stopTimer(); st.L[st.level] = freshLevel(st.level); st.view = 'home'; save(); render(); toTop(); break;
    case 'start-section': { const s = sec(), r = rec(), mode = P().mode; r.timed = mode !== 'untimed'; r.rem = Math.round(s.minutes * 60 * MODES[mode].mult); r.status = 'open'; if (s.questions) r.qi = 0; st.view = s.questions ? 'section' : 'essay'; save(); render(); toTop(); break; }
    case 'pick': { const r = rec(); r.ans[r.qi] = r.ans[r.qi] === i ? null : i; save(); question(); break; }
    case 'flag': { const r = rec(); r.flag[r.qi] = !r.flag[r.qi]; save(); question(); break; }
    case 'prev': { const r = rec(); if (r.qi > 0) { r.qi--; question(); } break; }
    case 'next': { const r = rec(); if (r.qi < sec().questions.length - 1) { r.qi++; question(); } break; }
    case 'goto': rec().qi = i; question(); break;
    case 'leave': leave(); break;
    case 'ask-end': askEnd(); break;
    case 'close-dlg': document.getElementById('dlg').innerHTML = ''; break;
    case 'end': endSection(false); break;
    case 'tab': reviewTab = i; results(); break;
    case 'copy-essay': { const out = document.getElementById('copied'), txt = P().s.essay.text, fail = () => { out.textContent = 'Copy was blocked. Select the text and copy it by hand.'; }; try { navigator.clipboard.writeText(txt).then(() => { out.textContent = 'Copied.'; }, fail); } catch (err) { fail(); } break; }
  }
});
app.addEventListener('change', e => {
  if (e.target.name === 'mode') { P().mode = e.target.value; save(); }
  if (e.target.id === 'missed') { missedOnly = e.target.checked; results(); }
});
app.addEventListener('input', e => { if (e.target.id === 'essay') { rec().text = e.target.value; wc(); } });
document.addEventListener('keydown', e => {
  if (st.view !== 'section' || paperLevel() || e.target.tagName === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector('.overlay')) { if (e.key === 'Escape') document.getElementById('dlg').innerHTML = ''; return; }
  const s = sec(), r = rec(), k = e.key.toLowerCase(), n = 'abcd'.indexOf(k);
  if (k.length === 1 && n >= 0) { r.ans[r.qi] = r.ans[r.qi] === n ? null : n; save(); question(); }
  else if (e.key === 'ArrowRight' && r.qi < s.questions.length - 1) { r.qi++; question(); }
  else if (e.key === 'ArrowLeft' && r.qi > 0) { r.qi--; question(); }
});
window.addEventListener('hashchange', () => { if (paperLevel() && (st.view === 'section' || st.view === 'essay')) { stopTimer(); keepEssay(); st.view = 'home'; save(); } render(); toTop(); });
window.addEventListener('pagehide', () => { if (st.view === 'essay') keepEssay(); save(); });

st = load() || fresh();
if (!TESTS[st.level]) st.level = LV[0];
// After a reload every clock is paused: open on the section list and let the student resume from there.
st.view = 'home'; st.notice = '';
render();
</script>
</body>
</html>
