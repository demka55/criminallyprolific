<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISEE Upper Level Practice Test 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a test booklet page (serif) inside a quiet proctor's frame (sans); answers are bubble-sheet ovals. */
:root{
  --paper:#eef1f4; --sheet:#ffffff; --ink:#1b2430; --muted:#5a6675; --line:#d3dae2;
  --accent:#1f4e8c; --accent-soft:#e2ebf6; --pencil:#f2b705; --pencil-ink:#5b4300;
  --good:#1d7a4f; --good-soft:#e1f2e9; --bad:#b3372f; --bad-soft:#f8e4e2;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --book:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161c; --sheet:#1a2129; --ink:#e6ebf0; --muted:#9aa6b3; --line:#2f3a46;
    --accent:#84b3ee; --accent-soft:#1e2f45; --pencil:#f2b705; --pencil-ink:#ffe08a;
    --good:#5cc491; --good-soft:#17332a; --bad:#ef8a80; --bad-soft:#3a1f1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161c; --sheet:#1a2129; --ink:#e6ebf0; --muted:#9aa6b3; --line:#2f3a46;
  --accent:#84b3ee; --accent-soft:#1e2f45; --pencil:#f2b705; --pencil-ink:#ffe08a;
  --good:#5cc491; --good-soft:#17332a; --bad:#ef8a80; --bad-soft:#3a1f1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--book);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:1.9rem;line-height:1.2}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:22px}
.wide{max-width:1180px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:22px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}

.btn{border:1px solid var(--line);background:var(--sheet);border-radius:5px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet);font-weight:600}
.btn.flagged{background:var(--pencil);border-color:var(--pencil);color:#3a2b00}
.btn:disabled{opacity:.45;cursor:default}
a{color:var(--accent)}

table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}

.modes{display:flex;flex-wrap:wrap;gap:10px}
.modes label{flex:1 1 200px;border:1px solid var(--line);border-radius:5px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.modes label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.modes input{margin-top:4px;accent-color:var(--accent)}

/* test bar */
.bar{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.bar .name{font-family:var(--book);font-weight:600;font-size:1.05rem}
.clock{font-variant-numeric:tabular-nums;font-weight:600;font-size:1.15rem;padding:3px 10px;border:1px solid var(--line);border-radius:5px;min-width:5.2em;text-align:center}
.clock.warn{border-color:var(--pencil);background:var(--pencil);color:#3a2b00}

.test{max-width:860px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
.test.split{max-width:1180px}
.split-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.split-grid{grid-template-columns:1fr}}
.passage{font-family:var(--book);font-size:1.04rem;line-height:1.62;max-height:72vh;overflow-y:auto}
@media (max-width:820px){.passage{max-height:46vh}}
.passage p{margin:0 0 .9em;display:grid;grid-template-columns:1.6em 1fr}
.passage p:last-child{margin-bottom:0}
.passage .pn{font-family:var(--ui);font-size:.72rem;color:var(--muted);padding-top:.45em;font-variant-numeric:tabular-nums}

.qtext{font-family:var(--book);font-size:1.12rem;line-height:1.55}
.syn{font-family:var(--book);font-size:1.5rem;letter-spacing:.12em;font-weight:600}
.blank{display:inline-block;width:4.5em;border-bottom:1.5px solid currentColor;margin:0 .15em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.2;margin:0 .15em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .25em 1px}
.fr>span:last-child{padding:1px .25em 0}
sup{font-size:.7em;line-height:0}
.dt{width:auto;margin:12px 0;font-family:var(--ui);font-size:.95rem}
.dt td,.dt th{border:1px solid var(--line);padding:5px 14px}

.qc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qc>div{border:1px solid var(--line);border-radius:5px;padding:10px 12px;text-align:center;font-family:var(--book);font-size:1.1rem}
.qc .eyebrow{display:block;margin-bottom:6px;font-family:var(--ui)}
.qc-info{text-align:center;font-family:var(--book);font-size:1.08rem}

.choices{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.choice{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:5px;padding:10px 12px;font-family:var(--book);font-size:1.06rem}
.choice:hover{border-color:var(--accent)}
.oval{flex:none;width:2.1em;height:1.45em;border:1.5px solid var(--muted);border-radius:999px;display:grid;place-items:center;font-family:var(--ui);font-size:.78rem;font-weight:600;color:var(--muted)}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice.on .oval{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.right .oval{background:var(--good);border-color:var(--good);color:var(--sheet)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .oval{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.choice .tag{margin-left:auto;font-family:var(--ui);font-size:.75rem;font-weight:600;white-space:nowrap}
.choice.right .tag{color:var(--good)} .choice.wrong .tag{color:var(--bad)}
div.choice{cursor:default}

.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.nb{position:relative;border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:6px 0;font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.nb.done{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.nb.cur{outline:2px solid var(--accent);outline-offset:1px}
.nb.fl::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--pencil);border:1.5px solid var(--sheet)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.legend .l1{background:var(--ink);border-color:var(--ink)} .legend .l2{background:var(--pencil);border-color:var(--pencil);border-radius:50%}

.overlay{position:fixed;inset:0;background:rgba(10,15,20,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:22px;max-width:440px;width:100%}

textarea{width:100%;min-height:340px;font-family:var(--book);font-size:1.05rem;line-height:1.6;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:5px;padding:14px;resize:vertical}

.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:90px}
.meter>span{display:block;height:100%;background:var(--accent)}
.pill{display:inline-block;font-size:.75rem;font-weight:600;border-radius:99px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.pill.low{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.pill.ok{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:6px 14px;font-size:.9rem}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.item{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:12px}
.item:first-child{border-top:0;padding-top:0}
.why{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:.95rem}
details>summary{cursor:pointer;color:var(--accent);font-size:.9rem}
.essay-out{font-family:var(--book);white-space:pre-wrap;line-height:1.6}
.key{columns:4 120px;font-variant-numeric:tabular-nums;font-size:.92rem}
.key div{break-inside:avoid;padding:1px 0}
@media print{.noprint{display:none!important}.sheet{border:0;padding:0}.passage{max-height:none;overflow:visible}body{background:#fff}}
@media (prefers-reduced-motion:no-preference){.meter>span{transition:width .3s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const TEST = {"sections":[{"id":"vr","name":"Verbal Reasoning","minutes":20,"intro":"Questions 1–19 are synonyms: choose the word closest in meaning to the word in capital letters. Questions 20–40 are sentence completions: choose the word or pair of words that best completes the sentence.","questions":[{"t":"Synonyms","syn":true,"q":"CANDID","c":["evasive","frank","cheerful","hasty"],"a":1,"e":"Candid means honest and direct, so \"frank\" is the closest match."},{"t":"Synonyms","syn":true,"q":"ABATE","c":["intensify","abandon","diminish","debate"],"a":2,"e":"To abate is to become less intense. \"Diminish\" matches; \"intensify\" is the opposite."},{"t":"Synonyms","syn":true,"q":"FRUGAL","c":["thrifty","fragile","generous","fruitful"],"a":0,"e":"A frugal person spends carefully, which is what \"thrifty\" means."},{"t":"Synonyms","syn":true,"q":"TENACIOUS","c":["timid","gracious","delicate","persistent"],"a":3,"e":"Tenacious means holding on firmly and not giving up, so \"persistent\" is correct."},{"t":"Synonyms","syn":true,"q":"LUCID","c":["lucky","fluid","dim","clear"],"a":3,"e":"Lucid means easy to understand or clear. \"Dim\" is close to an opposite."},{"t":"Synonyms","syn":true,"q":"BENEVOLENT","c":["kind","wealthy","hostile","obedient"],"a":0,"e":"Benevolent (from Latin for \"well-wishing\") means kind and generous."},{"t":"Synonyms","syn":true,"q":"MUNDANE","c":["gloomy","sacred","ordinary","massive"],"a":2,"e":"Mundane means everyday or commonplace, so \"ordinary\" fits."},{"t":"Synonyms","syn":true,"q":"AUGMENT","c":["argue","increase","reduce","predict"],"a":1,"e":"To augment something is to add to it or make it larger."},{"t":"Synonyms","syn":true,"q":"REPUDIATE","c":["repeat","reject","restore","reward"],"a":1,"e":"To repudiate is to refuse to accept or to disown, so \"reject\" is closest."},{"t":"Synonyms","syn":true,"q":"EPHEMERAL","c":["eternal","delicate","fleeting","mysterious"],"a":2,"e":"Ephemeral things last a very short time. \"Eternal\" is the opposite."},{"t":"Synonyms","syn":true,"q":"GREGARIOUS","c":["sociable","greedy","irritable","enormous"],"a":0,"e":"A gregarious person enjoys the company of others, so \"sociable\" is correct."},{"t":"Synonyms","syn":true,"q":"PRAGMATIC","c":["dramatic","idealistic","stubborn","practical"],"a":3,"e":"Pragmatic means concerned with what works in practice. \"Idealistic\" is nearly opposite."},{"t":"Synonyms","syn":true,"q":"OBSOLETE","c":["obscure","outdated","absolute","stubborn"],"a":1,"e":"Something obsolete is no longer in use because it has been replaced, so \"outdated\" fits."},{"t":"Synonyms","syn":true,"q":"AMELIORATE","c":["worsen","measure","improve","admire"],"a":2,"e":"To ameliorate a situation is to make it better."},{"t":"Synonyms","syn":true,"q":"LACONIC","c":["terse","sluggish","mournful","ironic"],"a":0,"e":"Laconic means using very few words, which is what \"terse\" means."},{"t":"Synonyms","syn":true,"q":"VENERATE","c":["ventilate","avenge","exaggerate","revere"],"a":3,"e":"To venerate is to regard with deep respect, so \"revere\" is correct."},{"t":"Synonyms","syn":true,"q":"INSIPID","c":["inspiring","bland","reckless","impatient"],"a":1,"e":"Insipid means lacking flavor or interest, so \"bland\" is closest."},{"t":"Synonyms","syn":true,"q":"CAPRICIOUS","c":["spacious","cautious","fickle","captive"],"a":2,"e":"A capricious person changes mood or mind without warning, so \"fickle\" matches."},{"t":"Synonyms","syn":true,"q":"EQUIVOCAL","c":["ambiguous","equal","vocal","fair"],"a":0,"e":"An equivocal statement can be read more than one way, so \"ambiguous\" is correct."},{"t":"Sentence completion","q":"Although the scientist's theory was initially met with <span class=\"blank\"><\/span>, further experiments eventually convinced even her harshest critics.","c":["enthusiasm","skepticism","indifference","gratitude"],"a":1,"e":"\"Although\" and \"eventually convinced\" signal that people doubted the theory at first. Skepticism means doubt."},{"t":"Sentence completion","q":"The mayor's speech was so <span class=\"blank\"><\/span> that many in the audience struggled to stay awake.","c":["tedious","provocative","concise","eloquent"],"a":0,"e":"A speech that puts people to sleep is long and boring, which is what \"tedious\" means."},{"t":"Sentence completion","q":"Because the evidence was entirely <span class=\"blank\"><\/span>, the jury could not be certain that the defendant had been at the scene.","c":["conclusive","circumstantial","abundant","public"],"a":1,"e":"Circumstantial evidence only suggests a conclusion indirectly, which explains the jury's uncertainty. Conclusive evidence would have removed the doubt."},{"t":"Sentence completion","q":"The once-thriving mill town became <span class=\"blank\"><\/span> after the factory closed, its streets empty and its storefronts boarded up.","c":["prosperous","congested","desolate","picturesque"],"a":2,"e":"Empty streets and boarded-up stores describe a deserted, bleak place: desolate."},{"t":"Sentence completion","q":"Unlike her <span class=\"blank\"><\/span> brother, who rarely spoke at family gatherings, Maya was outgoing and talkative.","c":["boisterous","reticent","affable","arrogant"],"a":1,"e":"\"Unlike\" sets up a contrast with outgoing and talkative. Reticent means reserved and unwilling to speak."},{"t":"Sentence completion","q":"The treaty was intended to <span class=\"blank\"><\/span> tensions between the two nations, but instead it deepened their mutual distrust.","c":["alleviate","provoke","document","prolong"],"a":0,"e":"\"But instead\" shows the treaty did the opposite of its goal. The goal was to ease, or alleviate, tensions."},{"t":"Sentence completion","q":"The professor was known for her <span class=\"blank\"><\/span> lectures, which wandered from topic to topic without ever reaching a clear point.","c":["succinct","rigorous","digressive","compelling"],"a":2,"e":"Lectures that wander from topic to topic are digressive. Succinct means the opposite."},{"t":"Sentence completion","q":"Rather than accept the award for himself, the coach <span class=\"blank\"><\/span> the team's success to the players' discipline and hard work.","c":["attributed","denied","compared","surrendered"],"a":0,"e":"To attribute success to something is to name it as the cause, which fits \"to the players' discipline.\""},{"t":"Sentence completion","q":"The artist's early paintings were <span class=\"blank\"><\/span>, copying the style of her teachers; only later did she develop a truly original voice.","c":["innovative","derivative","controversial","abstract"],"a":1,"e":"Work that copies the style of others is derivative. The second half contrasts this with being original."},{"t":"Sentence completion","q":"The desert plant's thick, waxy leaves are an <span class=\"blank\"><\/span> that allows it to retain water during long droughts.","c":["obstacle","illusion","anomaly","adaptation"],"a":3,"e":"A feature that helps an organism survive in its environment is an adaptation."},{"t":"Sentence completion","q":"The witness's account was so full of <span class=\"blank\"><\/span> that investigators doubted any of it was true.","c":["details","emotion","inconsistencies","insight"],"a":2,"e":"Investigators would doubt a story that contradicts itself. Inconsistencies are contradictions."},{"t":"Sentence completion","q":"Despite his <span class=\"blank\"><\/span> appearance, the old sailor proved to be gentle and soft-spoken.","c":["gruff","mild","tidy","youthful"],"a":0,"e":"\"Despite\" signals a contrast with gentle and soft-spoken. Gruff means rough and stern."},{"t":"Sentence completion","q":"The new regulations were criticized as <span class=\"blank\"><\/span>, since they imposed heavy burdens on small businesses while producing little benefit.","c":["lenient","onerous","transparent","temporary"],"a":1,"e":"Onerous means burdensome, which matches \"imposed heavy burdens.\""},{"t":"Sentence completion","q":"A <span class=\"blank\"><\/span> reader, Jorge finished three or four novels every week.","c":["reluctant","careless","critical","voracious"],"a":3,"e":"Someone who reads several novels a week has a huge appetite for reading. Voracious means having a great appetite."},{"t":"Sentence completion","q":"The committee's decision was <span class=\"blank\"><\/span>: not a single member voted against the proposal.","c":["unanimous","contentious","arbitrary","tentative"],"a":0,"e":"A decision everyone agrees on is unanimous. The colon introduces the definition."},{"t":"Sentence completion","q":"The author's prose is admired for its <span class=\"blank\"><\/span>; she conveys complex ideas in remarkably <span class=\"blank\"><\/span> sentences.","c":["verbosity . . . brief","economy . . . spare","obscurity . . . clear","elegance . . . clumsy"],"a":1,"e":"The second half explains the first, so both words must agree. Economy of style means using few words, and spare sentences are lean ones. The other pairs contradict themselves."},{"t":"Sentence completion","q":"Though the explorer's journals are often <span class=\"blank\"><\/span>, exaggerating his own bravery, historians still consider them <span class=\"blank\"><\/span> sources of information about the region.","c":["modest . . . worthless","accurate . . . unreliable","boastful . . . valuable","dull . . . entertaining"],"a":2,"e":"Journals that exaggerate the writer's bravery are boastful. \"Though . . . still\" means historians value them anyway."},{"t":"Sentence completion","q":"The drought was so <span class=\"blank\"><\/span> that even the deepest wells in the valley ran <span class=\"blank\"><\/span>.","c":["brief . . . full","mild . . . dry","welcome . . . clear","severe . . . dry"],"a":3,"e":"\"So . . . that even\" calls for an extreme cause and its result: a severe drought makes wells run dry. A mild drought would not affect the deepest wells."},{"t":"Sentence completion","q":"Far from being <span class=\"blank\"><\/span>, the negotiator was willing to <span class=\"blank\"><\/span> on nearly every point in order to reach an agreement.","c":["flexible . . . insist","obstinate . . . compromise","generous . . . yield","stubborn . . . refuse"],"a":1,"e":"\"Far from being\" means the two blanks are opposites. A negotiator who compromises is the opposite of obstinate (stubborn)."},{"t":"Sentence completion","q":"Because the medicine's effects are <span class=\"blank\"><\/span>, patients must take it every few hours to maintain <span class=\"blank\"><\/span> relief.","c":["transient . . . continuous","permanent . . . temporary","harmful . . . lasting","gradual . . . immediate"],"a":0,"e":"Effects that wear off quickly are transient, so frequent doses are needed to keep relief continuous."},{"t":"Sentence completion","q":"The critic's review was <span class=\"blank\"><\/span> rather than constructive, offering plenty of <span class=\"blank\"><\/span> but no suggestions for improvement.","c":["balanced . . . praise","encouraging . . . insults","thorough . . . silence","scathing . . . ridicule"],"a":3,"e":"\"Rather than constructive\" calls for a harsh word, and scathing means harshly critical. Ridicule matches that tone."}]},{"id":"qr","name":"Quantitative Reasoning","minutes":35,"intro":"Questions 1–20 are word problems. Questions 21–37 are quantitative comparisons: compare the quantity in Column A with the quantity in Column B. No calculator is allowed. Use scratch paper.","questions":[{"t":"Word problems","q":"If 3x + 7 = 31, what is the value of 6x − 5?","c":["37","43","48","53"],"a":1,"e":"3x = 24, so x = 8. Then 6(8) − 5 = 43."},{"t":"Word problems","q":"A jar contains only red and blue marbles in a ratio of 3 to 5. If there are 40 marbles in the jar, how many more blue marbles are there than red marbles?","c":["5","8","10","15"],"a":2,"e":"The ratio has 8 parts, so each part is 40 ÷ 8 = 5 marbles. Red = 15 and blue = 25, a difference of 10."},{"t":"Word problems","q":"The average of five numbers is 18. When one of the numbers is removed, the average of the remaining four numbers is 16. What number was removed?","c":["20","22","24","26"],"a":3,"e":"The five numbers total 5 × 18 = 90. The remaining four total 4 × 16 = 64. The removed number is 90 − 64 = 26."},{"t":"Word problems","q":"Which expression is equal to <span class=\"fr\"><span>2<sup>3<\/sup> × 2<sup>5<\/sup><\/span><span>2<sup>2<\/sup><\/span><\/span>?","c":["2<sup>4<\/sup>","2<sup>6<\/sup>","2<sup>10<\/sup>","4<sup>6<\/sup>"],"a":1,"e":"Add exponents when multiplying and subtract when dividing: 3 + 5 − 2 = 6, so the result is 2<sup>6<\/sup>."},{"t":"Word problems","q":"A jacket that regularly sells for $40 is marked down 25%. At the register, an additional 10% is taken off the marked-down price. What is the final price?","c":["$26.00","$27.00","$28.00","$30.00"],"a":1,"e":"25% off $40 leaves $30. Then 10% of $30 is $3, so the final price is $27. The discounts cannot simply be added to make 35%."},{"t":"Word problems","q":"When the positive integer n is divided by 4, the remainder is 3. What is the remainder when 5n is divided by 4?","c":["0","1","2","3"],"a":3,"e":"Try n = 3: 5n = 15, and 15 ÷ 4 leaves remainder 3. Any other such n (7, 11, . . .) gives the same result."},{"t":"Word problems","q":"The length of a rectangle is increased by 20% and its width is decreased by 20%. How does the area of the rectangle change?","c":["It decreases by 4%.","It does not change.","It increases by 4%.","It decreases by 20%."],"a":0,"e":"The new area is 1.2 × 0.8 = 0.96 of the original, a decrease of 4%."},{"t":"Word problems","q":"In the sequence 2, 5, 11, 23, 47, . . . each term after the first is found by applying the same rule to the term before it. What is the next term?","c":["71","94","95","96"],"a":2,"e":"Each term is double the previous term plus 1: 2 × 47 + 1 = 95."},{"t":"Word problems","q":"The sum of three consecutive even integers is 78. What is the greatest of the three integers?","c":["24","26","28","30"],"a":2,"e":"The middle integer is 78 ÷ 3 = 26, so the integers are 24, 26, and 28."},{"t":"Word problems","q":"A bag contains 4 red, 3 green, and 5 blue tiles. Two tiles are drawn at random, one after the other, without replacement. What is the probability that both tiles are blue?","c":["<span class=\"fr\"><span>5<\/span><span>33<\/span><\/span>","<span class=\"fr\"><span>25<\/span><span>144<\/span><\/span>","<span class=\"fr\"><span>5<\/span><span>18<\/span><\/span>","<span class=\"fr\"><span>5<\/span><span>12<\/span><\/span>"],"a":0,"e":"The first tile is blue with probability <span class=\"fr\"><span>5<\/span><span>12<\/span><\/span>. Then 4 of the remaining 11 tiles are blue. <span class=\"fr\"><span>5<\/span><span>12<\/span><\/span> × <span class=\"fr\"><span>4<\/span><span>11<\/span><\/span> = <span class=\"fr\"><span>20<\/span><span>132<\/span><\/span> = <span class=\"fr\"><span>5<\/span><span>33<\/span><\/span>."},{"t":"Word problems","q":"Machine A makes 60 parts in 4 hours. Machine B makes 60 parts in 6 hours. Working together at these rates, how many hours will the two machines take to make 100 parts?","c":["3","4","5","6"],"a":1,"e":"A makes 15 parts per hour and B makes 10, for 25 per hour together. 100 ÷ 25 = 4 hours."},{"t":"Word problems","q":"In a certain class, 60% of the students are girls. If 25% of the girls and 40% of the boys play a sport, what percent of the class plays a sport?","c":["31%","32.5%","35%","65%"],"a":0,"e":"Girls who play: 0.25 × 60% = 15% of the class. Boys who play: 0.40 × 40% = 16% of the class. Total: 31%."},{"t":"Word problems","q":"If x and y are positive integers and xy = 36, what is the greatest possible value of x + y?","c":["20","24","36","37"],"a":3,"e":"The sum is largest when the factors are farthest apart: 1 × 36 gives 1 + 36 = 37."},{"t":"Word problems","q":"The surface area of a cube is 150 square centimeters. What is the volume of the cube, in cubic centimeters?","c":["25","75","125","625"],"a":2,"e":"Each of the 6 faces has area 150 ÷ 6 = 25, so each edge is 5 cm. Volume = 5 × 5 × 5 = 125."},{"t":"Word problems","q":"On a number line, point P is at −7 and point Q is at 13. Point R is <span class=\"fr\"><span>3<\/span><span>4<\/span><\/span> of the way from P to Q. What is the coordinate of R?","c":["5","6","8","9.75"],"a":2,"e":"The distance from P to Q is 20, and <span class=\"fr\"><span>3<\/span><span>4<\/span><\/span> of 20 is 15. Then −7 + 15 = 8."},{"t":"Word problems","q":"For all numbers a and b, let a ◊ b be defined as a<sup>2<\/sup> − 2b. What is the value of 5 ◊ (3 ◊ 2)?","c":["15","17","21","25"],"a":0,"e":"First, 3 ◊ 2 = 9 − 4 = 5. Then 5 ◊ 5 = 25 − 10 = 15."},{"t":"Word problems","q":"A car travels 150 miles at 50 miles per hour and then returns over the same 150 miles at 75 miles per hour. What is the car's average speed, in miles per hour, for the entire trip?","c":["60","62.5","65","70"],"a":0,"e":"The trip out takes 3 hours and the return takes 2 hours. Average speed = total distance ÷ total time = 300 ÷ 5 = 60. Averaging 50 and 75 gives the trap answer 62.5."},{"t":"Word problems","q":"How many different positive whole-number factors does 72 have?","c":["10","12","14","16"],"a":1,"e":"72 = 2<sup>3<\/sup> × 3<sup>2<\/sup>, so the number of factors is (3 + 1)(2 + 1) = 12. They are 1, 2, 3, 4, 6, 8, 9, 12, 18, 24, 36, 72."},{"t":"Word problems","q":"A circle is inscribed in a square with sides of length 10, so that the circle touches all four sides. What is the area of the region that is inside the square but outside the circle?","c":["100 − 10π","100 − 25π","100 − 50π","100 − 100π"],"a":1,"e":"The circle's diameter is 10, so its radius is 5 and its area is 25π. The square's area is 100. The difference is 100 − 25π."},{"t":"Word problems","q":"If 2<sup>x + 1<\/sup> = 32, what is the value of x<sup>2<\/sup>?","c":["4","8","9","16"],"a":3,"e":"32 = 2<sup>5<\/sup>, so x + 1 = 5 and x = 4. Then x<sup>2<\/sup> = 16."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"25% of 80","B":"80% of 25","a":2,"e":"Both equal 20. In general, a% of b equals b% of a."},{"t":"Quantitative comparisons","qc":true,"info":"x &gt; 0","A":"x<sup>2<\/sup>","B":"x","a":3,"e":"If x = 2, then x<sup>2<\/sup> = 4 is greater. If x = <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>, then x<sup>2<\/sup> = <span class=\"fr\"><span>1<\/span><span>4<\/span><\/span> is smaller. If x = 1 they are equal. The relationship cannot be determined."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"(−2)<sup>4<\/sup>","B":"−2<sup>4<\/sup>","a":0,"e":"(−2)<sup>4<\/sup> = 16. Without parentheses, the exponent applies only to the 2, so −2<sup>4<\/sup> = −16."},{"t":"Quantitative comparisons","qc":true,"info":"A triangle has sides of length 5, 12, and 13.","A":"The area of the triangle","B":"30","a":2,"e":"5-12-13 is a right triangle, so the legs 5 and 12 are the base and height. Area = <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> × 5 × 12 = 30."},{"t":"Quantitative comparisons","qc":true,"info":"3a = 2b, and a and b are positive.","A":"a","B":"b","a":1,"e":"b = <span class=\"fr\"><span>3<\/span><span>2<\/span><\/span>a. Since a is positive, b is one and a half times a, so b is greater."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"√36 + √64","B":"√100","a":0,"e":"√36 + √64 = 6 + 8 = 14, while √100 = 10. Square roots cannot be added by adding the numbers under the radical."},{"t":"Quantitative comparisons","qc":true,"info":"The mean of 4, 8, 12, and x is 9.","A":"x","B":"12","a":2,"e":"The four numbers total 4 × 9 = 36. Then x = 36 − 24 = 12."},{"t":"Quantitative comparisons","qc":true,"info":"A fair coin is flipped 3 times.","A":"The probability of exactly 2 heads","B":"The probability of at least 2 heads","a":1,"e":"\"At least 2 heads\" includes every outcome with exactly 2 heads plus the outcome HHH, so it is more likely: <span class=\"fr\"><span>4<\/span><span>8<\/span><\/span> compared with <span class=\"fr\"><span>3<\/span><span>8<\/span><\/span>."},{"t":"Quantitative comparisons","qc":true,"info":"Line m has a slope of −2 and passes through the point (0, 6).","A":"The x-intercept of line m","B":"4","a":1,"e":"The equation is y = −2x + 6. Setting y = 0 gives x = 3, which is less than 4."},{"t":"Quantitative comparisons","qc":true,"info":"n is an integer greater than 1.","A":"<span class=\"fr\"><span>n + 1<\/span><span>n<\/span><\/span>","B":"<span class=\"fr\"><span>n<\/span><span>n − 1<\/span><\/span>","a":1,"e":"Column A is 1 + <span class=\"fr\"><span>1<\/span><span>n<\/span><\/span> and Column B is 1 + <span class=\"fr\"><span>1<\/span><span>n − 1<\/span><\/span>. Since n − 1 is smaller than n, <span class=\"fr\"><span>1<\/span><span>n − 1<\/span><\/span> is larger, so Column B is greater."},{"t":"Quantitative comparisons","qc":true,"info":"x + y = 10","A":"xy","B":"25","a":3,"e":"If x = y = 5, then xy = 25 and the columns are equal. If x = 4 and y = 6, then xy = 24, which is less. The relationship cannot be determined."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"The number of minutes in 2.5 days","B":"The number of seconds in 1 hour","a":2,"e":"2.5 days = 2.5 × 24 × 60 = 3,600 minutes. One hour = 60 × 60 = 3,600 seconds."},{"t":"Quantitative comparisons","qc":true,"info":"The price of a bicycle was increased by 10%. The new price was then decreased by 10%.","A":"The original price","B":"The final price","a":0,"e":"The final price is 1.1 × 0.9 = 0.99 of the original. The 10% decrease is taken from a larger amount than the 10% increase, so the original price is greater."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"The circumference of a circle with radius 4","B":"The perimeter of a square with side 6","a":0,"e":"The circumference is 8π, which is about 25.1. The perimeter is 24."},{"t":"Quantitative comparisons","qc":true,"info":"a &lt; b &lt; 0","A":"a<sup>2<\/sup>","B":"b<sup>2<\/sup>","a":0,"e":"Both numbers are negative, and a is farther from zero. Squaring gives the larger result for the number farther from zero. Example: a = −3, b = −2 gives 9 and 4."},{"t":"Quantitative comparisons","qc":true,"info":"The median of five different positive integers is 10.","A":"The mean of the five integers","B":"10","a":3,"e":"The set 1, 2, 10, 11, 12 has mean 7.2. The set 8, 9, 10, 50, 60 has mean 27.4. The mean can fall on either side of 10."},{"t":"Quantitative comparisons","qc":true,"info":"","A":"2<sup>10<\/sup>","B":"10<sup>3<\/sup>","a":0,"e":"2<sup>10<\/sup> = 1,024 and 10<sup>3<\/sup> = 1,000."}]},{"id":"rc","name":"Reading Comprehension","minutes":35,"intro":"There are six passages, each followed by six questions. Answer each question based on what is stated or implied in the passage.","passages":[{"paras":["Few animals vanish as completely as an octopus. A diver may stare directly at one resting on a reef and see only rock and algae, until the \"rock\" unfurls eight arms and glides away. This disappearing act is unlike the white winter coat of an arctic hare, which takes weeks to grow in. It happens in a fraction of a second, and the animal can undo it just as quickly.","The secret lies in the skin. An octopus's skin contains thousands of chromatophores, tiny elastic sacs filled with yellow, red, or brown pigment. Each sac is ringed by muscles under the direct control of the nervous system. When the muscles contract, the sac is stretched wide, like a drop of ink pressed flat under glass, and its color shows. When the muscles relax, the sac shrinks to a nearly invisible dot. Because nerves rather than slow-moving hormones give the orders, an octopus can change its entire appearance faster than a person can blink.","Color, however, is only part of the disguise. Beneath the chromatophores lie cells that reflect light, producing shimmering blues, greens, and whites that the pigments cannot make. The octopus can also change the texture of its skin, raising small bumps called papillae to mimic the rough surface of coral or the fronds of seaweed. A smooth animal becomes, in an instant, a spiky one.","What puzzles scientists most is that octopuses appear to be colorblind. Their eyes contain only one type of light-sensing cell, whereas human eyes have three. How can an animal match colors it cannot see? One hypothesis holds that the oddly shaped pupil of the octopus, which resembles a U or a dumbbell, lets different colors of light focus at slightly different distances, so that the animal could work out color by adjusting its focus. Another points to light-sensitive proteins found in octopus skin, which suggest that the skin itself may \"see\" in some limited way. Neither idea has been proven, and the answer may involve both.","For now, the octopus keeps its secret. What is certain is that its camouflage is not a costume worn over the animal but an extension of its nervous system: something close to a thought made visible."]},{"paras":["In the early 1800s, hauling a ton of goods overland from Buffalo to New York City cost about one hundred dollars and took weeks. The Appalachian Mountains stood like a wall between the Atlantic coast and the fertile lands around the Great Lakes, and the few roads that crossed them were rutted tracks that turned to mud each spring. Farmers in the interior often found it cheaper to float their crops down the Mississippi River to New Orleans than to send them a few hundred miles east.","DeWitt Clinton, who became governor of New York, championed an audacious remedy: a canal 363 miles long, running from Albany on the Hudson River to Buffalo on Lake Erie. Nothing on that scale had been attempted in the United States, which did not yet have a single school of engineering. Thomas Jefferson had called the idea \"little short of madness.\" When the federal government declined to pay, critics mocked the project as \"Clinton's Ditch,\" and the state decided to finance the canal itself.","Construction began in 1817. With no trained engineers to hire, the builders learned on the job. Surveyors who had only laid out property lines taught themselves to design locks and aqueducts. Workers invented machines to pull stumps and found a local limestone that made a cement able to harden underwater. Thousands of laborers, many of them Irish immigrants, dug the channel largely by hand through swamp, forest, and solid rock. By the time they finished in 1825, they had built 83 locks to lift boats more than 500 feet between the Hudson and Lake Erie.","The results silenced the skeptics. Freight rates fell by roughly ninety percent. Tolls repaid the cost of construction within about a decade. Towns such as Syracuse and Rochester swelled into cities along the route, and New York City, now the gateway to the interior of the continent, became the busiest port in the nation.","The canal's success also invited competition. It had proved that linking East and West was enormously profitable, and investors soon poured money into a faster technology, the railroad, which could run in winter when the canal froze. Yet the \"ditch\" had already done its work. It had shown a young country that it could build on a grand scale, and it had trained, in the absence of any school, the nation's first generation of engineers."]},{"paras":["On the evening of October 1, 1847, a twenty-nine-year-old librarian climbed to the roof of a bank on the island of Nantucket, where her father worked and where the family kept a small telescope. Maria Mitchell had spent most of her clear nights there since childhood. Her father had taught her to rate the chronometers that whaling captains relied on to find their position at sea, work that demanded meticulous attention, and she had gone on to teach herself advanced mathematics during quiet hours at the library.","That night she noticed a faint blur where her star charts showed nothing. She suspected at once that it was a comet, but she was cautious, and she checked it again the next evening before allowing her father to announce the find. The delay nearly cost her the credit. The king of Denmark had promised a gold medal to the first person to discover a comet too dim to be seen without a telescope, and an astronomer in Europe spotted the same object two days after she did. Only after months of letters was her claim accepted.","The medal made Mitchell famous. She became the first woman elected to the American Academy of Arts and Sciences, and in 1865 the newly founded Vassar College hired her as its professor of astronomy. There she proved to be as unconventional a teacher as she was a scientist. She refused to give grades for memorized answers and sent her students to the telescope instead, insisting that they trust what they had observed for themselves over what they had read. She took them halfway across the country to watch solar eclipses. When she learned that she was being paid less than younger men on the faculty, she demanded a raise and received it.","Mitchell taught at Vassar for more than twenty years. Several of her students became scientists themselves, at a time when few universities would admit women at all. She had found her comet by looking carefully at what others had overlooked, and she spent the rest of her life teaching young women to do the same."]},{"paras":["Not long ago, finding your way across an unfamiliar city meant unfolding a map, studying it, and holding a picture of the streets in your head. Today a calm voice tells us to turn left in four hundred feet, and we turn. We arrive on time, by the fastest route, having noticed almost nothing along the way. I do not want to give up this convenience, and I doubt you do either. But I have begun to wonder what we are trading for it.","Finding a route is a skill, and like other skills it appears to weaken without use. Researchers who studied London taxi drivers, who must memorize thousands of streets before they are licensed, found that the part of the brain associated with spatial memory was larger in experienced drivers than in other people. The brain, it seems, responds to navigation the way a muscle responds to exercise. It is reasonable to suspect that the reverse is also true, and that an ability we never practice will atrophy.","The loss is not only a matter of brain tissue. When we work out a route for ourselves, we learn how a place fits together: that the river runs along the east side, that the bakery is two blocks from the station, that the hill we dread on a bicycle is the same one with the view. A person who has only followed instructions knows a list of turns. Such a traveler is a passenger in his own journey, delivered to the destination like a package.","None of this requires us to throw our phones into the river. It asks only for a small habit. Before the next trip to somewhere new, look at the whole map first. Try to find the way, and keep the voice in reserve for the moment you are truly stuck. You may take a wrong turn. You may even be a few minutes late. In exchange, you will know where you have been."]},{"paras":["When a honeybee finds a rich patch of flowers, she does not keep the news to herself. She returns to the hive and, on the vertical surface of the honeycomb, performs a looping pattern that other bees crowd around to follow. For centuries beekeepers watched this behavior without understanding it. The Austrian scientist Karl von Frisch spent decades trying to decipher it, and what he found was so surprising that many of his colleagues refused to believe him.","The pattern, von Frisch concluded, is a set of directions. The bee runs in a straight line while shaking her body rapidly from side to side, then circles back to the starting point and repeats the run, tracing a figure eight. The straight, waggling portion carries the message. Its angle shows direction: a run aimed straight up the comb means \"fly toward the sun,\" while a run angled sixty degrees to the right of vertical means \"fly sixty degrees to the right of the sun.\" Its length shows distance: the longer the bee waggles, the farther away the food lies.","The hive is dark, so the watching bees cannot see the performance. They follow it by touch, pressing close to the dancer and sensing her movements with their antennae. More remarkable still, the dancers correct for time. The sun moves across the sky during the day, and a bee that dances for many minutes gradually shifts the angle of her run to keep her directions accurate.","Skeptics argued that the recruits were simply following the scent of flowers carried on the dancer's body, and that the dance itself told them nothing. The dispute lasted for years. It was largely settled when researchers fitted bees with tiny radar tags and tracked them after they left the hive. Bees that had followed a dance flew directly toward the area it indicated, even when they had been carried to a different starting point first.","Von Frisch shared a Nobel Prize in 1973. What he had uncovered is rare in the animal world: a signal that stands for something far away and out of sight. A bee in a dark hive, moving her body, can tell her sisters about a field they have never visited."]},{"paras":["The summer I turned thirteen, my grandmother decided I should learn to row. I considered this unnecessary. I had watched her cross the cove a hundred times, the oars dipping and rising as evenly as breathing, and I was sure there was nothing to it. You pulled, and the boat went.","The boat did not go. On my first morning the oars behaved like two stubborn mules, each with its own idea of where we were headed. One dug deep and stuck; the other skipped across the surface and threw water into my lap. We turned in a slow circle twenty feet from the dock while my grandmother sat in the stern with her hands folded, looking at the far shore as though nothing unusual were happening.","\"You're fighting it,\" she said at last.","I told her, grudgingly, that I was not fighting anything. I was rowing. She nodded and said nothing more, which was worse than an argument. I pulled harder. The harder I pulled, the more the boat lurched and wandered, and by the time we drifted back against the dock my palms were raw and I had decided that rowing was a pointless thing to know.","I went back the next morning anyway, mostly because she was already sitting in the boat. It took most of July. There was no single day when it changed, but at some point I stopped hauling on the oars and began to wait for them. I learned to let the blades find the water before I leaned back, and to let the boat run on between strokes without hurrying it. The cove, which had seemed determined to keep me in one place, turned out to have no opinion about me at all.","On the last day of the month I rowed us to the far shore and back. My grandmother trailed one hand in the water the whole way. When we reached the dock she said, \"There,\" and climbed out, and that was all the praise I got. It was enough. I have thought of that word many times since, usually when I catch myself pulling too hard at something that only needed me to pay attention."]}],"questions":[{"t":"Main idea","q":"The primary purpose of the passage is to","c":["explain how octopuses change their appearance and describe an unanswered question about that ability","argue that octopuses are more intelligent than other sea animals","compare the camouflage of octopuses with that of arctic hares","prove that octopuses can see color with their skin"],"a":0,"e":"Paragraphs 2 and 3 explain the mechanism, and paragraphs 4 and 5 present the colorblindness puzzle. The hare appears once, and the skin hypothesis is called unproven.","p":0},{"t":"Supporting detail","q":"According to the passage, an octopus can change color very quickly because its chromatophores are","c":["filled with three different pigments","located above cells that reflect light","controlled by nerves rather than hormones","smaller than the cells in human skin"],"a":2,"e":"Paragraph 2 says that \"because nerves rather than slow-moving hormones give the orders,\" the change is faster than a blink.","p":0},{"t":"Figurative language","q":"In the second paragraph, the author compares a chromatophore to \"a drop of ink pressed flat under glass\" in order to","c":["suggest that octopus pigment is similar to ink","show how a stretched sac spreads out and displays its color","explain why the sacs are nearly invisible","describe how scientists study octopus skin"],"a":1,"e":"The comparison describes what happens when the muscles contract: the sac is stretched wide and its color becomes visible.","p":0},{"t":"Vocabulary in context","q":"In the third paragraph, the word \"mimic\" most nearly means","c":["mock","avoid","cover","imitate"],"a":3,"e":"The octopus raises bumps so that its skin resembles coral or seaweed. It imitates those surfaces.","p":0},{"t":"Inference","q":"The author mentions the arctic hare in the first paragraph most likely to","c":["show that many animals use white as camouflage","suggest that hares and octopuses are related","emphasize by contrast how fast an octopus changes","explain why octopuses live on reefs"],"a":2,"e":"The hare's coat \"takes weeks to grow in,\" which contrasts with a change that happens \"in a fraction of a second.\"","p":0},{"t":"Inference","q":"Which statement best describes how the passage presents the two hypotheses in the fourth paragraph?","c":["The first has been proven, and the second has been rejected.","Both are reasonable possibilities, but neither has been confirmed.","Both have been abandoned by most scientists.","The second is far more likely than the first."],"a":1,"e":"The paragraph ends: \"Neither idea has been proven, and the answer may involve both.\"","p":0},{"t":"Main idea","q":"Which sentence best states the main idea of the passage?","c":["The Erie Canal was a costly mistake that railroads soon replaced.","DeWitt Clinton was the most important governor in the history of New York.","Canals are a cheaper way to move goods than roads or railroads.","Although widely doubted, the Erie Canal transformed American trade and showed what the nation could build."],"a":3,"e":"The passage moves from doubt (\"Clinton's Ditch\") to results (lower costs, growing cities) to legacy (proof the country \"could build on a grand scale\").","p":1},{"t":"Vocabulary in context","q":"In the second paragraph, the word \"audacious\" most nearly means","c":["bold","expensive","foolish","familiar"],"a":0,"e":"The plan was daring because nothing on that scale had been tried. The author's tone is admiring, so \"foolish\" (the critics' view) does not fit.","p":1},{"t":"Organization","q":"The first paragraph serves mainly to","c":["describe the geography of the Mississippi River","establish the problem that the canal was meant to solve","explain why farmers moved to the Great Lakes region","introduce the people who built the canal"],"a":1,"e":"The paragraph describes how costly and slow it was to move goods east, which sets up the canal as the \"remedy\" in paragraph 2.","p":1},{"t":"Supporting detail","q":"According to the passage, how did the builders deal with the lack of trained engineers?","c":["They hired experts from Europe.","They waited until an engineering school opened.","They taught themselves the necessary skills while working.","They asked the federal government for help."],"a":2,"e":"Paragraph 3 says \"the builders learned on the job\" and surveyors \"taught themselves to design locks and aqueducts.\"","p":1},{"t":"Inference","q":"The nickname \"Clinton's Ditch\" suggests that critics regarded the project with","c":["scorn","curiosity","fear","admiration"],"a":0,"e":"The passage says critics \"mocked\" the project. Calling a grand canal a ditch belittles it.","p":1},{"t":"Inference","q":"It can be inferred from the last paragraph that the Erie Canal","c":["was closed as soon as the first railroads were built","was less profitable than its builders had hoped","could carry more freight than a railroad","helped bring about the technology that competed with it"],"a":3,"e":"The canal \"proved that linking East and West was enormously profitable,\" which led investors to fund railroads.","p":1},{"t":"Main idea","q":"The passage is primarily concerned with","c":["explaining how comets are discovered","describing the history of Vassar College","recounting the achievements of a pioneering astronomer and teacher","arguing that women were treated unfairly in the 1800s"],"a":2,"e":"The passage follows Mitchell from her discovery to her teaching career. Unfair treatment is mentioned, but it is one detail and not the focus.","p":2},{"t":"Vocabulary in context","q":"In the first paragraph, the word \"meticulous\" most nearly means","c":["brief","careful","cheerful","occasional"],"a":1,"e":"Rating instruments that ships depend on demands precise, careful attention.","p":2},{"t":"Supporting detail","q":"According to the passage, Mitchell almost lost credit for her discovery because","c":["she waited to confirm what she had seen before it was announced","her telescope was too small to see the comet clearly","the king of Denmark did not believe a librarian could find a comet","her father announced the discovery under his own name"],"a":0,"e":"Paragraph 2: she \"checked it again the next evening\" before the announcement, and \"the delay nearly cost her the credit.\"","p":2},{"t":"Inference","q":"Mitchell's response to learning about her salary suggests that she was","c":["more interested in money than in teaching","unhappy at Vassar and eager to leave","unsure of her own abilities","willing to challenge treatment she considered unfair"],"a":3,"e":"She \"demanded a raise and received it,\" and then stayed at Vassar for more than twenty years.","p":2},{"t":"Supporting detail","q":"The passage indicates that Mitchell's teaching emphasized","c":["memorizing facts from textbooks","learning through direct observation","preparing students for written examinations","studying the work of European astronomers"],"a":1,"e":"She \"sent her students to the telescope\" and insisted they trust what they had observed over what they had read.","p":2},{"t":"Organization","q":"Which best describes the organization of the passage?","c":["Events are presented in the order in which they happened.","A theory is stated and then supported with examples.","Two people are compared and contrasted.","A problem is described and several solutions are proposed."],"a":0,"e":"The passage is chronological: her youth, the 1847 discovery, the medal, Vassar in 1865, and her later legacy.","p":2},{"t":"Main idea","q":"The author's main argument is that","c":["navigation apps are less accurate than paper maps","people should stop using navigation apps entirely","relying completely on turn-by-turn directions costs us a skill and a sense of place","taxi drivers are better navigators than most people"],"a":2,"e":"Paragraph 2 covers the lost skill and paragraph 3 the lost understanding of place. The author says clearly that we need not give up our phones.","p":3},{"t":"Organization","q":"The author mentions London taxi drivers in order to","c":["show that some jobs do not allow navigation apps","support the claim that practicing navigation strengthens the brain","prove that London is difficult to navigate","suggest a career for people with good memories"],"a":1,"e":"The study is evidence that \"the brain . . . responds to navigation the way a muscle responds to exercise.\"","p":3},{"t":"Vocabulary in context","q":"In the second paragraph, the word \"atrophy\" most nearly means","c":["improve","spread","change","weaken"],"a":3,"e":"The author argues that skills \"weaken without use.\" Atrophy means to waste away from lack of use.","p":3},{"t":"Tone","q":"The tone of the passage can best be described as","c":["thoughtful and gently cautionary","angry and accusing","playful and sarcastic","detached and scientific"],"a":0,"e":"The author admits to liking the convenience, raises a concern, and ends with a modest suggestion. There is no anger or sarcasm.","p":3},{"t":"Figurative language","q":"The phrase \"delivered to the destination like a package\" in the third paragraph suggests that a person following directions","c":["arrives more quickly than other travelers","is treated rudely by the navigation app","reaches the destination without taking an active part in getting there","often ends up at the wrong address"],"a":2,"e":"A package is moved without knowing or choosing its route. The author contrasts this with someone who understands how a place fits together.","p":3},{"t":"Inference","q":"With which statement would the author most likely agree?","c":["Being late is always worse than getting lost.","Paper maps should be required in schools.","Technology has made people less intelligent overall.","A small inconvenience can be worth what it teaches."],"a":3,"e":"The last paragraph accepts a wrong turn or a few minutes' delay in exchange for knowing \"where you have been.\"","p":3},{"t":"Main idea","q":"The passage is mainly about","c":["the life and career of Karl von Frisch","how honeybees communicate the location of food and how scientists confirmed it","why honeybees are important to agriculture","the differences between honeybees and other insects"],"a":1,"e":"Paragraphs 2 and 3 explain the dance, and paragraph 4 describes how the explanation was tested.","p":4},{"t":"Supporting detail","q":"According to the passage, a bee indicates the direction of food by","c":["the number of loops she completes","the speed at which she shakes her body","the scent she carries back to the hive","the angle of her waggling run on the comb"],"a":3,"e":"Paragraph 2: \"Its angle shows direction.\"","p":4},{"t":"Inference","q":"If a returning bee performs unusually long waggling runs, the bees following her can conclude that the food is","c":["relatively far from the hive","of unusually high quality","in the direction of the sun","very close to the hive"],"a":0,"e":"Paragraph 2: \"the longer the bee waggles, the farther away the food lies.\"","p":4},{"t":"Vocabulary in context","q":"In the first paragraph, the word \"decipher\" most nearly means","c":["record","copy","interpret","defend"],"a":2,"e":"Von Frisch was trying to work out the meaning of the behavior, as one would decode a message.","p":4},{"t":"Organization","q":"The author describes the radar study in the fourth paragraph in order to","c":["show that von Frisch's critics were correct","explain how bees find their way back to the hive","present evidence that resolved a scientific disagreement","suggest that more research is still needed"],"a":2,"e":"The dispute over scent versus dance \"was largely settled\" by tracking where the bees flew.","p":4},{"t":"Inference","q":"According to the last paragraph, the dance is remarkable mainly because it","c":["is performed entirely in darkness","conveys information about a place that is distant and unseen","earned its discoverer a Nobel Prize","is more complicated than human language"],"a":1,"e":"The author calls it rare: \"a signal that stands for something far away and out of sight.\"","p":4},{"t":"Main idea","q":"The passage is primarily about","c":["the narrator's difficult relationship with a grandparent","the proper technique for rowing a boat","a lesson the narrator learned through a frustrating experience","the dangers of going out on the water unprepared"],"a":2,"e":"The narrator moves from overconfidence to frustration to understanding, and the last sentence applies the lesson to later life.","p":5},{"t":"Inference","q":"At the beginning of the passage, the narrator's attitude toward learning to row is best described as","c":["overconfident","fearful","eager","grateful"],"a":0,"e":"The narrator calls the lessons \"unnecessary\" and is \"sure there was nothing to it.\"","p":5},{"t":"Figurative language","q":"The comparison of the oars to \"two stubborn mules\" emphasizes that the oars","c":["were too heavy for the narrator to lift","were old and in poor repair","made a great deal of noise","seemed to resist the narrator's control"],"a":3,"e":"Each oar had \"its own idea of where we were headed,\" like an animal that will not be led.","p":5},{"t":"Vocabulary in context","q":"In the fourth paragraph, the word \"grudgingly\" most nearly means","c":["loudly","reluctantly","honestly","quickly"],"a":1,"e":"The narrator is annoyed and does not want to respond at all, so the reply is given unwillingly.","p":5},{"t":"Inference","q":"The grandmother can best be described as","c":["strict and demanding","anxious and protective","patient and sparing with words","cheerful and talkative"],"a":2,"e":"She waits calmly, offers one short observation, does not argue, and praises with a single word.","p":5},{"t":"Inference","q":"The final sentence of the passage suggests that the narrator","c":["still rows regularly as an adult","has applied what was learned in the boat to other parts of life","wishes the grandmother had offered more praise","regrets having been stubborn as a child"],"a":1,"e":"The narrator remembers the lesson when \"pulling too hard at something that only needed me to pay attention,\" which reaches beyond rowing.","p":5}]},{"id":"ma","name":"Mathematics Achievement","minutes":40,"intro":"Each question has four answer choices. No calculator is allowed. Use scratch paper.","questions":[{"t":"Number sense","q":"What is the value of 18 − 3 × (4 − 6)<sup>2<\/sup> ÷ 2?","c":["6","12","24","30"],"a":1,"e":"Parentheses: (−2)<sup>2<\/sup> = 4. Then 3 × 4 ÷ 2 = 6. Finally 18 − 6 = 12."},{"t":"Algebra","q":"If 5(x − 2) = 3x + 8, what is the value of x?","c":["−1","1","9","18"],"a":2,"e":"5x − 10 = 3x + 8, so 2x = 18 and x = 9."},{"t":"Geometry","q":"Two angles of a triangle measure 47° and 68°. What is the measure of the third angle?","c":["45°","55°","65°","75°"],"a":2,"e":"The angles of a triangle add to 180°. 180 − 47 − 68 = 65."},{"t":"Data and probability","q":"A student's five test scores are 82, 90, 76, 88, and 94. What is the mean score?","c":["84","85","86","88"],"a":2,"e":"The total is 430, and 430 ÷ 5 = 86."},{"t":"Number sense","q":"What is the value of <span class=\"fr\"><span>3<\/span><span>4<\/span><\/span> + <span class=\"fr\"><span>5<\/span><span>6<\/span><\/span> − <span class=\"fr\"><span>1<\/span><span>3<\/span><\/span>?","c":["<span class=\"fr\"><span>7<\/span><span>12<\/span><\/span>","1","<span class=\"fr\"><span>5<\/span><span>4<\/span><\/span>","<span class=\"fr\"><span>3<\/span><span>2<\/span><\/span>"],"a":2,"e":"Use a common denominator of 12: <span class=\"fr\"><span>9<\/span><span>12<\/span><\/span> + <span class=\"fr\"><span>10<\/span><span>12<\/span><\/span> − <span class=\"fr\"><span>4<\/span><span>12<\/span><\/span> = <span class=\"fr\"><span>15<\/span><span>12<\/span><\/span> = <span class=\"fr\"><span>5<\/span><span>4<\/span><\/span>."},{"t":"Measurement","q":"What is the area of a circle with a diameter of 14?","c":["14π","28π","49π","196π"],"a":2,"e":"The radius is 7, and area = πr<sup>2<\/sup> = 49π."},{"t":"Algebra","q":"A phone plan costs $20 per month plus $0.05 for each text message sent. Which equation gives the monthly cost C, in dollars, when t text messages are sent?","c":["C = 20 + 0.05t","C = 20t + 0.05","C = 20.05t","C = 0.05(20 + t)"],"a":0,"e":"The fixed cost is 20, and the cost that depends on the number of texts is 0.05t."},{"t":"Number sense","q":"What is the value of |−8 + 3| − |4 − 9|?","c":["−10","0","6","10"],"a":1,"e":"|−5| − |−5| = 5 − 5 = 0."},{"t":"Geometry","q":"The legs of a right triangle have lengths 9 and 12. What is the length of the hypotenuse?","c":["12","13","14","15"],"a":3,"e":"9<sup>2<\/sup> + 12<sup>2<\/sup> = 81 + 144 = 225, and √225 = 15. This is a 3-4-5 triangle scaled by 3."},{"t":"Data and probability","q":"What is the median of the data set 3, 7, 7, 8, 10, 13?","c":["7","7.5","8","10"],"a":1,"e":"With six values, the median is the average of the third and fourth: (7 + 8) ÷ 2 = 7.5."},{"t":"Algebra","q":"If 2x + y = 11 and x − y = 1, what is the value of y?","c":["2","3","4","5"],"a":1,"e":"Add the equations: 3x = 12, so x = 4. Then 4 − y = 1, so y = 3."},{"t":"Number sense","q":"Which of the following shows 0.00042 written in scientific notation?","c":["4.2 × 10<sup>−3<\/sup>","4.2 × 10<sup>−4<\/sup>","42 × 10<sup>−4<\/sup>","4.2 × 10<sup>4<\/sup>"],"a":1,"e":"Move the decimal point 4 places to the right to get 4.2, so the exponent is −4."},{"t":"Measurement","q":"A trapezoid has bases of length 8 and 14 and a height of 5. What is its area?","c":["55","70","110","560"],"a":0,"e":"Area = <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> × (8 + 14) × 5 = 11 × 5 = 55."},{"t":"Algebra","q":"What is the slope of the line that passes through the points (−2, 5) and (4, −7)?","c":["−2","−<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>","2"],"a":0,"e":"Slope = <span class=\"fr\"><span>−7 − 5<\/span><span>4 − (−2)<\/span><\/span> = <span class=\"fr\"><span>−12<\/span><span>6<\/span><\/span> = −2."},{"t":"Geometry","q":"The point (3, −4) is reflected across the x-axis. What are the coordinates of its image?","c":["(−3, −4)","(−3, 4)","(3, 4)","(−4, 3)"],"a":2,"e":"Reflecting across the x-axis keeps the x-coordinate and changes the sign of the y-coordinate."},{"t":"Data and probability","q":"A spinner has 8 equal sections numbered 1 through 8. What is the probability that the spinner lands on a prime number?","c":["<span class=\"fr\"><span>1<\/span><span>8<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>4<\/span><\/span>","<span class=\"fr\"><span>3<\/span><span>8<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>"],"a":3,"e":"The primes from 1 to 8 are 2, 3, 5, and 7. The number 1 is not prime. <span class=\"fr\"><span>4<\/span><span>8<\/span><\/span> = <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>."},{"t":"Number sense","q":"Which of the following is the greatest?","c":["<span class=\"fr\"><span>5<\/span><span>8<\/span><\/span>","0.62","63%","<span class=\"fr\"><span>3<\/span><span>5<\/span><\/span>"],"a":2,"e":"As decimals: <span class=\"fr\"><span>5<\/span><span>8<\/span><\/span> = 0.625, 0.62, 63% = 0.63, and <span class=\"fr\"><span>3<\/span><span>5<\/span><\/span> = 0.6. The greatest is 63%."},{"t":"Algebra","q":"Which expression is equivalent to (3x<sup>2<\/sup>y)(−2xy<sup>3<\/sup>)?","c":["−6x<sup>2<\/sup>y<sup>3<\/sup>","−6x<sup>3<\/sup>y<sup>4<\/sup>","6x<sup>3<\/sup>y<sup>4<\/sup>","−6x<sup>3<\/sup>y<sup>3<\/sup>"],"a":1,"e":"Multiply the coefficients (3 × −2 = −6) and add the exponents for each variable: x<sup>2+1<\/sup> and y<sup>1+3<\/sup>."},{"t":"Measurement","q":"What is the volume of a cylinder with a radius of 3 and a height of 10?","c":["30π","90π","180π","300π"],"a":1,"e":"Volume = πr<sup>2<\/sup>h = π × 9 × 10 = 90π."},{"t":"Algebra","q":"Which of the following is the solution to −3x + 4 &gt; 19?","c":["x &gt; −5","x &gt; 5","x &lt; 5","x &lt; −5"],"a":3,"e":"−3x &gt; 15. Dividing by a negative number reverses the inequality: x &lt; −5."},{"t":"Data and probability","q":"The mean of 6 numbers is 15. If a seventh number, 29, is added to the set, what is the new mean?","c":["16","17","18","22"],"a":1,"e":"The six numbers total 90. Adding 29 gives 119, and 119 ÷ 7 = 17."},{"t":"Geometry","q":"What is the sum of the measures of the interior angles of a hexagon?","c":["360°","540°","600°","720°"],"a":3,"e":"For a polygon with n sides the sum is (n − 2) × 180°. For n = 6: 4 × 180° = 720°."},{"t":"Number sense","q":"What is the least common multiple of 12, 18, and 30?","c":["60","90","180","360"],"a":2,"e":"12 = 2<sup>2<\/sup> × 3, 18 = 2 × 3<sup>2<\/sup>, 30 = 2 × 3 × 5. Take the highest power of each prime: 2<sup>2<\/sup> × 3<sup>2<\/sup> × 5 = 180."},{"t":"Algebra","q":"Which equation represents the line with slope 3 that passes through the point (2, −1)?","c":["y = 3x − 1","y = 3x − 5","y = 3x − 7","y = 3x + 5"],"a":2,"e":"Substitute into y = 3x + b: −1 = 3(2) + b, so b = −7."},{"t":"Measurement","q":"On a floor plan, 1 inch represents 8 feet. A room measures 2.5 inches by 3 inches on the plan. What is the actual area of the room, in square feet?","c":["60","480","600","960"],"a":1,"e":"The room is 2.5 × 8 = 20 feet by 3 × 8 = 24 feet. 20 × 24 = 480."},{"t":"Algebra","q":"If f(x) = 2x<sup>2<\/sup> − 3x + 1, what is f(−2)?","c":["−13","3","11","15"],"a":3,"e":"2(−2)<sup>2<\/sup> − 3(−2) + 1 = 8 + 6 + 1 = 15."},{"t":"Data and probability","q":"The table shows the favorite season of 200 students.<table class=\"dt\"><tr><th>Season<\/th><th>Students<\/th><\/tr><tr><td>Fall<\/td><td>70<\/td><\/tr><tr><td>Winter<\/td><td>30<\/td><\/tr><tr><td>Spring<\/td><td>40<\/td><\/tr><tr><td>Summer<\/td><td>60<\/td><\/tr><\/table>If the results are shown in a circle graph, what is the measure of the central angle for Fall?","c":["35°","70°","126°","140°"],"a":2,"e":"Fall is <span class=\"fr\"><span>70<\/span><span>200<\/span><\/span> = 35% of the students, and 35% of 360° is 126°."},{"t":"Geometry","q":"Two parallel lines are cut by a transversal. One of the interior angles formed measures 112°. What is the measure of the other interior angle on the same side of the transversal?","c":["68°","78°","112°","248°"],"a":0,"e":"Interior angles on the same side of a transversal are supplementary: 180° − 112° = 68°."},{"t":"Algebra","q":"Which of the following is the factored form of x<sup>2<\/sup> − 5x − 24?","c":["(x − 8)(x + 3)","(x + 8)(x − 3)","(x − 6)(x + 4)","(x − 12)(x + 2)"],"a":0,"e":"Find two numbers that multiply to −24 and add to −5: −8 and 3."},{"t":"Number sense","q":"What is the value of √144 + <sup>3<\/sup>√(−27)?","c":["9","12","15","39"],"a":0,"e":"√144 = 12, and the cube root of −27 is −3. 12 + (−3) = 9."},{"t":"Measurement","q":"A car is traveling at 45 miles per hour. What is its speed in feet per second? (1 mile = 5,280 feet)","c":["33","44","60","66"],"a":3,"e":"45 × 5,280 feet per hour ÷ 3,600 seconds per hour = 66 feet per second."},{"t":"Algebra","q":"What are the solutions of x<sup>2<\/sup> − 6x + 5 = 0?","c":["−1 and −5","1 and 5","2 and 3","−1 and 5"],"a":1,"e":"Factor: (x − 1)(x − 5) = 0, so x = 1 or x = 5."},{"t":"Data and probability","q":"A fair number cube with faces numbered 1 through 6 is rolled twice. What is the probability that the sum of the two rolls is 9?","c":["<span class=\"fr\"><span>1<\/span><span>12<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>9<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>6<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>4<\/span><\/span>"],"a":1,"e":"Four of the 36 outcomes give 9: (3, 6), (4, 5), (5, 4), (6, 3). <span class=\"fr\"><span>4<\/span><span>36<\/span><\/span> = <span class=\"fr\"><span>1<\/span><span>9<\/span><\/span>."},{"t":"Geometry","q":"What is the distance between the points (1, 2) and (7, 10) in the coordinate plane?","c":["8","10","14","100"],"a":1,"e":"The horizontal change is 6 and the vertical change is 8. √(6<sup>2<\/sup> + 8<sup>2<\/sup>) = √100 = 10."},{"t":"Algebra","q":"The first term of an arithmetic sequence is 7, and each term after the first is 4 more than the term before it. What is the 20th term?","c":["80","83","87","91"],"a":1,"e":"The 20th term is the first term plus 19 steps of 4: 7 + 19 × 4 = 83."},{"t":"Number sense","q":"Which of the following is an irrational number?","c":["<span class=\"fr\"><span>22<\/span><span>7<\/span><\/span>","√49","0.333 . . .","√12"],"a":3,"e":"√12 = 2√3, which cannot be written as a fraction of integers. <span class=\"fr\"><span>22<\/span><span>7<\/span><\/span> is a fraction, √49 = 7, and 0.333 . . . = <span class=\"fr\"><span>1<\/span><span>3<\/span><\/span>."},{"t":"Measurement","q":"A rectangular box measures 4 by 5 by 6. What is its total surface area?","c":["74","120","134","148"],"a":3,"e":"2(4 × 5 + 4 × 6 + 5 × 6) = 2(20 + 24 + 30) = 148. The volume, 120, is a trap answer."},{"t":"Algebra","q":"For x ≠ −3, which expression is equivalent to <span class=\"fr\"><span>x<sup>2<\/sup> − 9<\/span><span>x + 3<\/span><\/span>?","c":["x − 3","x + 3","x − 9","x<sup>2<\/sup> − 3"],"a":0,"e":"x<sup>2<\/sup> − 9 = (x − 3)(x + 3). Cancel the common factor (x + 3)."},{"t":"Data and probability","q":"The table shows the number of hours that 20 students studied for a test.<table class=\"dt\"><tr><th>Hours studied<\/th><th>Students<\/th><\/tr><tr><td>1<\/td><td>4<\/td><\/tr><tr><td>2<\/td><td>6<\/td><\/tr><tr><td>3<\/td><td>7<\/td><\/tr><tr><td>4<\/td><td>3<\/td><\/tr><\/table>What is the mean number of hours studied?","c":["2.45","2.5","2.75","3"],"a":0,"e":"(1 × 4 + 2 × 6 + 3 × 7 + 4 × 3) ÷ 20 = 49 ÷ 20 = 2.45."},{"t":"Algebra","q":"If <span class=\"fr\"><span>4<\/span><span>x − 1<\/span><\/span> = <span class=\"fr\"><span>2<\/span><span>3<\/span><\/span>, what is the value of x?","c":["5","6","7","8"],"a":2,"e":"Cross-multiply: 12 = 2(x − 1) = 2x − 2, so 2x = 14 and x = 7."},{"t":"Geometry","q":"A triangle has sides of length 6, 8, and 10. A similar triangle has a shortest side of length 15. What is the perimeter of the similar triangle?","c":["48","54","60","72"],"a":2,"e":"The scale factor is 15 ÷ 6 = 2.5. The first triangle's perimeter is 24, and 24 × 2.5 = 60."},{"t":"Data and probability","q":"How many different arrangements of 3 letters can be made from the letters of the word PLANET if no letter is used more than once?","c":["18","20","60","120"],"a":3,"e":"There are 6 choices for the first letter, 5 for the second, and 4 for the third: 6 × 5 × 4 = 120."},{"t":"Algebra","q":"Which expression is equivalent to (2x − 3)<sup>2<\/sup>?","c":["4x<sup>2<\/sup> − 9","4x<sup>2<\/sup> + 9","4x<sup>2<\/sup> − 6x + 9","4x<sup>2<\/sup> − 12x + 9"],"a":3,"e":"(2x − 3)(2x − 3) = 4x<sup>2<\/sup> − 6x − 6x + 9 = 4x<sup>2<\/sup> − 12x + 9."},{"t":"Measurement","q":"The perimeter of a square is 36. What is the length of its diagonal?","c":["9√2","9√3","18","18√2"],"a":0,"e":"Each side is 9. The diagonal of a square is side × √2 = 9√2."},{"t":"Data and probability","q":"For the data set 4, 9, 9, 12, 16, 22, which statement is true?","c":["The mean is greater than the median.","The mode is greater than the median.","The range is 16.","The median is 12."],"a":0,"e":"Mean = 72 ÷ 6 = 12. Median = (9 + 12) ÷ 2 = 10.5. Mode = 9. Range = 18. Only the first statement is true."},{"t":"Algebra","q":"What are all the values of x for which |2x − 1| = 7?","c":["−4 and 3","4 only","−3 and 4","3 and 4"],"a":2,"e":"2x − 1 = 7 gives x = 4. 2x − 1 = −7 gives x = −3."},{"t":"Data and probability","q":"A bag contains 6 red marbles and 4 blue marbles. A marble is drawn at random and replaced, and then a second marble is drawn. What is the probability that one marble of each color is drawn?","c":["<span class=\"fr\"><span>4<\/span><span>25<\/span><\/span>","<span class=\"fr\"><span>6<\/span><span>25<\/span><\/span>","<span class=\"fr\"><span>9<\/span><span>25<\/span><\/span>","<span class=\"fr\"><span>12<\/span><span>25<\/span><\/span>"],"a":3,"e":"Red then blue: <span class=\"fr\"><span>6<\/span><span>10<\/span><\/span> × <span class=\"fr\"><span>4<\/span><span>10<\/span><\/span> = <span class=\"fr\"><span>6<\/span><span>25<\/span><\/span>. Blue then red is also <span class=\"fr\"><span>6<\/span><span>25<\/span><\/span>. Together: <span class=\"fr\"><span>12<\/span><span>25<\/span><\/span>."}]},{"id":"essay","name":"Essay","minutes":30,"intro":"You will be given one prompt. Plan and write an essay in response. The essay is not scored, but a copy is sent to every school that receives your scores.","prompt":"Think of a skill that took you a long time to learn. Describe how you learned it, and explain what the experience taught you about yourself.","note":"On the real test you write by hand on two lined pages, or type if you test online. Aim for four or five paragraphs."}]};
const SECS = TEST.sections;
const L = ['A', 'B', 'C', 'D'];
const QC_CHOICES = ['The quantity in Column A is greater.', 'The quantity in Column B is greater.', 'The two quantities are equal.', 'The relationship cannot be determined from the information given.'];
const MODES = { timed: { label: 'Standard time', note: 'Real test timing for each section.', mult: 1 }, extended: { label: 'Time and a half', note: 'For students approved for 50% extended time.', mult: 1.5 }, untimed: { label: 'Untimed', note: 'No clock. Good for a first look at the question types.', mult: 0 } };
const KEY = 'isee-ul-pt1-v1';
const app = document.getElementById('app');
let st, tick = null, reviewTab = 0, missedOnly = false, dialog = null;

function fresh() { const ans = {}, flag = {}; SECS.forEach(s => { if (s.questions) { ans[s.id] = s.questions.map(() => null); flag[s.id] = {}; } }); return { view: 'home', mode: 'timed', si: 0, qi: 0, ans, flag, rem: 0, essay: '', started: false, finished: false }; }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.ans && SECS.every(x => !x.questions || (s.ans[x.id] && s.ans[x.id].length === x.questions.length))) return s; } catch (e) {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s % 60; return m + ':' + String(r).padStart(2, '0'); };
const sec = () => SECS[st.si];
const choicesOf = q => q.qc ? QC_CHOICES : q.c;

function stem(q) {
  if (q.syn) return `<p class="syn">${q.q}</p>`;
  if (q.qc) return `${q.info ? `<p class="qc-info">${q.info}</p>` : ''}<div class="qc"><div><span class="eyebrow">Column A</span>${q.A}</div><div><span class="eyebrow">Column B</span>${q.B}</div></div>`;
  return `<div class="qtext">${q.q}</div>`;
}
function passageHTML(s, p) {
  return s.passages[p].paras.map((t, i) => `<p><span class="pn">${i + 1}</span><span>${t}</span></p>`).join('');
}

/* ---------- home ---------- */
function home() {
  const rows = SECS.map((s, i) => `<tr><td>${i + 1}. ${s.name}</td><td class="num">${s.questions ? s.questions.length : '1 prompt'}</td><td class="num">${s.minutes} min</td></tr>`).join('');
  const total = SECS.reduce((n, s) => n + (s.questions ? s.questions.length : 0), 0);
  let action;
  if (st.finished) action = `<button class="btn primary" data-act="results">See results</button><button class="btn" data-act="reset">Start over</button>`;
  else if (st.started) action = `<button class="btn primary" data-act="resume">Resume test</button><button class="btn" data-act="reset">Start over</button>`;
  else action = `<button class="btn primary" data-act="begin">Begin test</button>`;
  const modes = st.started ? '' : `<div class="stack"><h3>Timing</h3><div class="modes">${Object.entries(MODES).map(([k, m]) => `<label for="mode-${k}"><input type="radio" name="mode" id="mode-${k}" value="${k}" ${st.mode === k ? 'checked' : ''}><span><strong>${m.label}</strong><br><span class="small muted">${m.note}</span></span></label>`).join('')}</div></div>`;
  app.innerHTML = `<div class="wrap">
    <header class="stack"><span class="eyebrow">Full-length practice · applying to grades 9–12</span><h1>ISEE Upper Level Practice Test 1</h1>
    <p class="muted">${total} multiple-choice questions and an essay, in the same order and with the same time limits as the real test. Set aside about three hours, a quiet table, pencils and scratch paper. No calculator.</p></header>
    <section class="sheet stack"><div class="scroll-x"><table><thead><tr><th>Section</th><th class="num">Questions</th><th class="num">Time</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small muted">On test day there is a 5–10 minute break after section 2 and another after section 4. You can take the same breaks here: the clock only runs while a section is open.</p></section>
    <section class="sheet stack">${modes}
      <div class="stack"><h3>How it works</h3><ul class="small" style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px">
      <li>Within a section you can skip, flag and return to any question. Once a section ends you cannot go back to it.</li>
      <li>There is no penalty for a wrong answer, so answer every question.</li>
      <li>Your progress is saved in this browser, so a refresh will not lose your place.</li>
      <li>At the end you get a score for each section, a breakdown by topic and an explanation for every question.</li></ul></div>
      <div class="row">${action}<a href="#paper" class="small">View all questions on one page</a></div></section>
    <p class="small muted">These are original practice questions written to match the format and difficulty of the ISEE Upper Level. They are not official ERB questions, and this test is not affiliated with ERB.</p>
  </div>`;
}

/* ---------- section intro ---------- */
function intro() {
  const s = sec(), isEssay = !s.questions;
  const brk = (st.si === 2 || st.si === 4) ? `<p class="small muted">This is where the real test gives a 5–10 minute break. Stretch, get some water, and start when you are ready.</p>` : '';
  const time = st.mode === 'untimed' ? 'Untimed' : Math.round(s.minutes * MODES[st.mode].mult) + ' minutes';
  app.innerHTML = `<div class="wrap"><section class="sheet stack">
    <span class="eyebrow">Section ${st.si + 1} of ${SECS.length}</span><h1>${s.name}</h1>
    <p><strong>${isEssay ? '1 prompt' : s.questions.length + ' questions'}</strong> · <strong>${time}</strong></p>
    <p>${s.intro}</p>${brk}
    <div class="row"><button class="btn primary" data-act="start-section">Start section</button></div>
    <p class="small muted">The clock starts when you press Start.</p></section></div>`;
}

/* ---------- test section ---------- */
let shownPassage = -1;
function sectionShell() {
  const s = sec(), split = !!s.passages;
  shownPassage = -1;
